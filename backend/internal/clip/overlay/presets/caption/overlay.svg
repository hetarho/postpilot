<svg xmlns="http://www.w3.org/2000/svg" width="{{.Width}}" height="{{.Height}}">{{with .Scrim}}<defs><linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{.Fill}}" stop-opacity="{{.From}}"/><stop offset="1" stop-color="{{.Fill}}" stop-opacity="{{.To}}"/></linearGradient></defs><rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" fill="url(#scrim)"/>{{end}}{{with .Shadow}}<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="{{printf "%.3f" .DX}}" dy="{{printf "%.3f" .DY}}" stdDeviation="{{printf "%.3f" .Deviation}}" flood-color="{{.Fill}}" flood-opacity="{{.Opacity}}"/></filter></defs>{{end}}{{with .Plate}}<defs><clipPath id="plate"><rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}"/></clipPath></defs><rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}"/>{{end}}{{with .Bar}}<g clip-path="url(#plate)"><rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" fill="{{.Fill}}"/></g>{{end}}{{with .Dot}}<circle cx="{{printf "%.3f" .X}}" cy="{{printf "%.3f" .Y}}" r="{{printf "%.3f" .Radius}}" fill="{{.Fill}}"/>{{end}}{{range .Lines}}{{with .Highlight}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}"/>{{end}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}" stroke="{{.Stroke}}" stroke-opacity="{{.StrokeOpacity}}" stroke-width="{{printf "%.3f" .StrokeWidth}}" stroke-linejoin="round" paint-order="stroke fill"{{if .Shadow}} filter="url(#shadow)"{{end}}>{{if .Colored}}{{.Prefix}}<tspan fill="{{.Accent}}">{{.Keyword}}</tspan>{{.Suffix}}{{else}}{{.Value}}{{end}}</text>{{end}}</svg>
