<svg xmlns="http://www.w3.org/2000/svg" width="{{.Width}}" height="{{.Height}}">{{if not .Empty}}{{with .Shadow}}<defs><filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="{{printf "%.3f" .DX}}" dy="{{printf "%.3f" .DY}}" stdDeviation="{{printf "%.3f" .Deviation}}" flood-color="{{.Fill}}" flood-opacity="{{.Opacity}}"/></filter></defs>{{end}}{{with .Plate}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}" filter="url(#card)"/>{{end}}{{range .Lines}}{{with .Chip}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}" fill="{{.Fill}}"/>{{end}}{{with .Text}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}"{{if .Opacity}} fill-opacity="{{.Opacity}}"{{end}}>{{.Value}}</text>{{end}}{{end}}{{end}}</svg>
