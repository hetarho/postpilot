{{define "parts"}}{{range .Rules}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}"/>{{end}}{{range .Shapes}}{{if .Circle}}<circle cx="{{printf "%.3f" .X}}" cy="{{printf "%.3f" .Y}}" r="{{printf "%.3f" .Radius}}"{{else}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}"{{end}} fill="{{.Fill}}" fill-opacity="{{.Opacity}}" stroke="{{.Stroke}}" stroke-opacity="{{.StrokeOpacity}}" stroke-width="{{printf "%.3f" .StrokeWidth}}"{{if .Shadow}} filter="url(#shadow)"{{end}}/>{{end}}{{range .Lines}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}" stroke="{{.Stroke}}" stroke-opacity="{{.StrokeOpacity}}" stroke-width="{{printf "%.3f" .StrokeWidth}}" stroke-linejoin="round" paint-order="stroke fill"{{if .Shadow}} filter="url(#shadow)"{{end}}>{{.Value}}</text>{{end}}{{range .Arcs}}<defs><path id="{{.ID}}" d="{{.Path}}"/></defs><text xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}" stroke="{{.Stroke}}" stroke-opacity="{{.StrokeOpacity}}" stroke-width="{{printf "%.3f" .StrokeWidth}}" stroke-linejoin="round" paint-order="stroke fill" text-anchor="middle"{{if .Shadow}} filter="url(#shadow)"{{end}}><textPath href="#{{.ID}}" startOffset="50%">{{.Value}}</textPath></text>{{end}}{{end}}<svg xmlns="http://www.w3.org/2000/svg" width="{{.Width}}" height="{{.Height}}">{{with .Scrim}}<defs><linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{.Fill}}" stop-opacity="{{.From}}"/><stop offset="1" stop-color="{{.Fill}}" stop-opacity="{{.To}}"/></linearGradient></defs><rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" fill="url(#scrim)"/>{{end}}{{with .Radial}}<defs><radialGradient id="radial" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="{{.Fill}}" stop-opacity="{{.From}}"/><stop offset="{{.MidAt}}" stop-color="{{.Fill}}" stop-opacity="{{.Mid}}"/><stop offset="1" stop-color="{{.Fill}}" stop-opacity="{{.To}}"/></radialGradient></defs><ellipse cx="{{printf "%.3f" .CX}}" cy="{{printf "%.3f" .CY}}" rx="{{printf "%.3f" .RX}}" ry="{{printf "%.3f" .RY}}" fill="url(#radial)"/>{{end}}{{with .Shadow}}<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="{{printf "%.3f" .DX}}" dy="{{printf "%.3f" .DY}}" stdDeviation="{{printf "%.3f" .Deviation}}" flood-color="{{.Fill}}" flood-opacity="{{.Opacity}}"/></filter></defs>{{end}}{{template "parts" .}}{{with .Turn}}<g transform="rotate({{printf "%.3f" .Deg}} {{printf "%.3f" .X}} {{printf "%.3f" .Y}})">{{template "parts" .}}</g>{{end}}</svg>
