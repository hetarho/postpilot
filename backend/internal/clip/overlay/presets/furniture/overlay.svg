<svg xmlns="http://www.w3.org/2000/svg" width="{{.Width}}" height="{{.Height}}">{{with .Shadow}}<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="{{printf "%.3f" .DX}}" dy="{{printf "%.3f" .DY}}" stdDeviation="{{printf "%.3f" .Deviation}}" flood-color="{{.Fill}}" flood-opacity="{{.Opacity}}"/></filter></defs>{{end}}{{with .Badge}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}"/>{{end}}{{with .Label}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}">{{.Value}}</text>{{end}}{{range .Chips}}{{with .Label}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}" stroke="{{.Stroke}}" stroke-opacity="{{.StrokeOpacity}}" stroke-width="{{.StrokeWidth}}" paint-order="stroke fill" stroke-linejoin="round" filter="url(#shadow)">{{.Value}}</text>{{end}}{{with .Value}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}" stroke="{{.Stroke}}" stroke-opacity="{{.StrokeOpacity}}" stroke-width="{{.StrokeWidth}}" paint-order="stroke fill" stroke-linejoin="round" filter="url(#shadow)">{{.Value}}</text>{{end}}{{end}}</svg>
