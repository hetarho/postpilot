<svg xmlns="http://www.w3.org/2000/svg" width="{{.Width}}" height="{{.Height}}">{{with .Badge}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}"/>{{end}}{{with .Label}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}">{{.Value}}</text>{{end}}{{range .Chips}}<rect x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" width="{{printf "%.3f" .Width}}" height="{{printf "%.3f" .Height}}" rx="{{printf "%.3f" .Radius}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}"/>{{with .Label}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}" fill-opacity="{{.Opacity}}">{{.Value}}</text>{{end}}{{with .Value}}<text x="{{printf "%.3f" .X}}" y="{{printf "%.3f" .Y}}" xml:space="preserve" font-family="{{.Family}}" font-size="{{printf "%.0f" .Size}}" font-weight="{{.Weight}}" letter-spacing="{{printf "%.4f" .Tracking}}" fill="{{.Fill}}" textLength="{{printf "%.3f" .Length}}" lengthAdjust="spacingAndGlyphs">{{.Value}}</text>{{end}}{{end}}</svg>
