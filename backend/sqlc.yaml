        package: "sqlc"
        out: "internal/experiment/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/publishing/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/publishing/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/usage/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/usage/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/purpose/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/purpose/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/guideline/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/guideline/store/sqlc"
