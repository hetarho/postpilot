# sqlc v2. Run from backend/ (scripts/gen.mjs mounts it as the working dir), so every
# path here is backend-relative.
#
# The schema is the goose migrations directory, not a hand-kept schema.sql: sqlc reads
# the +goose Up blocks and ignores the Down blocks, which means the generated types can
# never drift from the migrations that actually run at boot.
#
# One `sql` entry per bounded context — each context owns its tables and its queries
# (ARCHITECTURE §2.2), so a context's generated code never sees another's rows.
version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/auth/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/auth/store/sqlc"
        # Without this, every generated package gets a struct for every table in the
        # schema — so adding a table to one context would rewrite another context's
        # generated code, which is exactly the ownership boundary sqlc is meant to keep.
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/post/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/post/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/provider/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/provider/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/job/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/job/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/voice/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/voice/store/sqlc"
        omit_unused_structs: true
  - engine: "sqlite"
    schema: "internal/platform/db/migrations"
    queries: "internal/experiment/store/queries"
    gen:
