# The provider connection (PRD §6.4). This file says how to REACH the model endpoint and
# which versioned recommendation sets exist. It no longer lists models: the usable-model
# catalog is curated data in `catalog_models`, browsed live from OpenRouter and enabled by
# an operator on /admin/models (plan 18). Connection is a file; models are rows.
#
# The file is validated at boot and a broken entry stops the API from starting, the same
# posture as a bad migration. A leftover `models:` list is rejected by the strict parser
# rather than silently ignored, so a stack mounting an old override hears about it.
#
# Exactly one provider may be declared. The curated catalog has no provider dimension —
# every row is served by the registered endpoint — so a second vendor is a design change
# (its own plan), not a yaml edit.
#
# Keys are NEVER written here. `api_key_env` names the environment variable the key is
# read from; when that variable is unset, every model is listed as disabled with the reason
# "API key not configured" and cannot be selected. Leave `api_key_env` out for an endpoint
# that takes no key (a local Ollama / vLLM / LM Studio).
# `reasoning_format: openrouter` opts the provider into OpenRouter's nested reasoning
# request extension; omit it for other OpenAI-compatible endpoints.
#
# Adapters: `openai_compatible` (needs `base_url`) covers OpenRouter, Together, Groq,
# Fireworks, DeepInfra, OpenAI, Ollama, vLLM, LM Studio and Google's compatible endpoint.
providers:
  - id: openrouter
    adapter: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    reasoning_format: openrouter

# Opt-in versioned pairings (plan 09). Never applied automatically. The refs name curated
# models, so whether a set can be applied is decided when a user applies it — against the
# catalog as it is then — not at boot.
recommendation_sets:
  - id: balanced-2026-08
    label: Balanced · August 2026
    selections:
      - stage: observe
        active: {provider_id: openrouter, model_id: google/gemini-3.7-flash}
        candidate_a: {provider_id: openrouter, model_id: google/gemini-3.7-flash}
        candidate_b: {provider_id: openrouter, model_id: qwen/qwen3.8-flash}
      - stage: analyze
        active: {provider_id: openrouter, model_id: openai/gpt-5.6-luna}
        candidate_a: {provider_id: openrouter, model_id: openai/gpt-5.6-luna}
        candidate_b: {provider_id: openrouter, model_id: deepseek/deepseek-v4-flash-0731}
      - stage: write
        active: {provider_id: openrouter, model_id: anthropic/claude-sonnet-5}
        candidate_a: {provider_id: openrouter, model_id: anthropic/claude-sonnet-5}
        candidate_b: {provider_id: openrouter, model_id: x-ai/grok-4.6}
