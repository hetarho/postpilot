# The provider connection (PRD §6.4). This file says how to REACH the model endpoint and
# nothing else. The usable-model catalog is curated data in `catalog_models`, browsed live
# from OpenRouter and enabled by an operator on /admin/models, and the recommendation sets
# are rows the operator edits on /admin/recommendations (MODEL-10, MODEL-69). Connection is
# a file; models and recommendations are rows.
#
# The file is validated at boot and a broken entry stops the API from starting, the same
# posture as a bad migration. A leftover `models:` or `recommendation_sets:` list is rejected
# by the strict parser rather than silently ignored, so a stack mounting an old override
# hears about it.
#
# Exactly one completion provider may be declared. The optional speech_provider is a
# separate connection for voice design and speech; its profiles/prices are curated rows,
# never completion models or implicit defaults. Omit it to disable speech entirely.
#
# Keys are NEVER written here. `api_key_env` names the environment variable the key is
# read from; when that variable is unset, every model is listed as disabled with the reason
# "API key not configured" and cannot be selected. Leave `api_key_env` out for an endpoint
# that takes no key (a local Ollama / vLLM / LM Studio).
# `reasoning_format: openrouter` opts the provider into OpenRouter's nested reasoning
# request extension; omit it for other OpenAI-compatible endpoints.
#
# Adapters: `openai_compatible` (needs `base_url`) covers OpenRouter, Together, Groq,
# Fireworks, DeepInfra, OpenAI, Ollama, vLLM, LM Studio and Google's compatible endpoint.
providers:
  - id: openrouter
    adapter: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    reasoning_format: openrouter

# Missing credentials disable speech without affecting the completion connection.
speech_provider:
  id: elevenlabs
  adapter: elevenlabs
  base_url: https://api.elevenlabs.io
  api_key_env: ELEVENLABS_API_KEY
