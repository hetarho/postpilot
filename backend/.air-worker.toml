root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/media-worker ./cmd/media-worker"
  bin = "./tmp/media-worker"
  include_ext = ["go", "yaml", "json", "svg", "ttf", "otf"]
  exclude_dir = ["tmp", "bin", "data"]
  delay = 800
  stop_on_error = true
  send_interrupt = true
  kill_delay = "40s"
  poll = true
  poll_interval = 1000

[log]
  time = true

[misc]
  clean_on_exit = true
