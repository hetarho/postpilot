# Local dev runtime. `pnpm dev:api` runs the backend here with air hot-reload so the
# Go toolchain version is pinned by the image, not by whatever is on the host.
# The frontend runs on the host (`pnpm dev:web`, Vite on :2564) and proxies /api here.
#
# `dev:api` passes `--build` on purpose. The `./backend:/app` mount carries Go source
# changes in, so a stale image still *looks* live — but anything baked at build time
# (the fonts and resvg below) stays whatever it was, and the process then exits 1 at
# boot while the container reports `Up`. The frontend sees only a 502 from the proxy.
# A cached rebuild costs a few seconds; that failure costs an afternoon.
#
# Host port 7678 → container 8080. The dev ports spell the project on a phone keypad —
# 7678 = P-O-S-T (api), 2564 = B-L-O-G (web) — which keeps them clear of 8080/1214 (the
# sibling cosimosi stack) and of every common dev default. In production the api owns 8080
# as usual; only the host-side mapping is unusual.
#
# SQLite lives in the named `backend_data` volume, not in the bind-mounted source tree —
# a WAL database on a Windows/WSL bind mount corrupts under concurrent access, and this
# way `docker compose down -v` is the reset button.
#
# Photos go to MinIO here and to Cloudflare R2 in production. Both speak the S3 API, so
# it is the same code and the same four R2_* variables — only their values change.
name: postpilot

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: postpilot-backend
    profiles: ["dev"]
    environment:
      PORT: "8080"
      CORS_ORIGIN: http://localhost:2564
      DB_PATH: /app/data/postpilot.db
      # The API talks to MinIO over the compose network; the browser cannot resolve
      # that name, so presigned URLs are minted against the published one. A signature
      # covers the Host header, which is why these must differ here and agree in prod.
      R2_ENDPOINT: http://minio:9000
      R2_PUBLIC_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: postpilot
      R2_SECRET_ACCESS_KEY: postpilot-dev-secret
      R2_BUCKET: postpilot
      # Explicit local overrides, validated against the owning media thread cap.
      # Production keeps 1 encode / 2 decode threads and one job per worker.
      CLIP_ENCODE_THREADS: "6"
      CLIP_DECODE_THREADS: "8"
      CLIP_MEDIA_EXECUTION: worker
      MEDIA_INTERNAL_ADDR: ":9000"
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
    # Provider API keys come from the repo-root .env, whatever names providers.yaml's
    # `api_key_env` uses — no per-provider line to add here. The explicit values above
    # win over the file, so its PORT/DB_PATH/R2_* (meant for a host-side run) do not
    # leak in. A missing file or an empty key is fine: those models show as disabled.
    env_file:
      - path: .env
        required: false
      - path: .env.media.dev
        required: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 300s
      retries: 6
    develop:
      watch: &media_asset_watch
        - action: rebuild
          path: ./backend/assets
        - action: rebuild
          path: ./backend/build
        - action: rebuild
          path: ./backend/Dockerfile.dev
        - action: rebuild
          path: ./backend/internal/clip/overlay
        - action: rebuild
          path: ./backend/internal/clip/design
    ports:
      - "7678:8080"
    volumes:
      - ./backend:/app
      - backend_go_mod:/go/pkg/mod
      - backend_tmp:/app/tmp
      - backend_data:/app/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  media-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    command: ["air", "-c", ".air-worker.toml"]
    env_file:
      - path: .env.media.dev
        required: true
    environment:
      MEDIA_ACCEL: cpu
      MEDIA_WORKER_CONCURRENCY: "1"
      CLIP_WORK_ROOT: /var/lib/postpilot-media/work
      CLIP_ENCODE_THREADS: "6"
      CLIP_DECODE_THREADS: "8"
    # Code and module caches are shareable. SQLite, API env and scratch space are not.
    volumes:
      - ./backend:/app
      - backend_go_mod:/go/pkg/mod
      - media_worker_build:/app/tmp
      - media_worker_work:/var/lib/postpilot-media
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "/app/tmp/media-worker", "health"]
      interval: 15s
      timeout: 30s
      start_period: 300s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    develop:
      watch: *media_asset_watch

  # Local stand-in for Cloudflare R2. Same S3 API, so nothing in the Go code knows the
  # difference. Console on 9001 if you want to look at what was uploaded.
  minio:
    image: minio/minio:latest
    container_name: postpilot-minio
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: postpilot
      MINIO_ROOT_PASSWORD: postpilot-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the bucket and leaves it PRIVATE, which is the property the app depends on:
  # a photo is readable only through a presigned URL the API issues to its owner
  # (PRD F-5). Runs once and exits; the api waits for it.
  minio-init:
    image: minio/mc:latest
    container_name: postpilot-minio-init
    profiles: ["dev"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 postpilot postpilot-dev-secret &&
      mc mb --ignore-existing local/postpilot &&
      mc anonymous set none local/postpilot
      "

volumes:
  backend_go_mod:
  backend_tmp:
  media_worker_build:
  media_worker_work:
  backend_data:
  minio_data:
