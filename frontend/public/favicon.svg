<?xml version="1.0" encoding="UTF-8"?>
<!-- The app icon. viewBox is tightened onto the mark (content is 956 units wide, centred at
     1024,1023.5 in the 2048 source) so the symbol fills ~78% of the tile instead of ~47% — at
     16-32px the source framing left the frame stroke sub-pixel. The background rect still spans
     0..2048, so it covers the crop. No width/height: the tile scales to whatever the browser,
     iOS springboard or Chrome's rasteriser asks for. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="411 410 1226 1226"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Postpilot app icon</title>
  <desc id="desc">A lavender rounded square, dot, and paper-plane symbol on a near-black background.</desc>

  <defs>
    <radialGradient id="backgroundGlow" cx="50%" cy="43%" r="78%">
      <stop offset="0" stop-color="#141119"/>
      <stop offset="0.58" stop-color="#110F14"/>
      <stop offset="1" stop-color="#0D0C10"/>
    </radialGradient>

    <linearGradient id="frameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C0BCC9"/>
      <stop offset="0.48" stop-color="#B7B1C1"/>
      <stop offset="1" stop-color="#B2AFBD"/>
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#B188FF"/>
      <stop offset="0.52" stop-color="#AD82FD"/>
      <stop offset="1" stop-color="#A879F7"/>
    </linearGradient>

    <radialGradient id="dotGradient" cx="42%" cy="32%" r="76%">
      <stop offset="0" stop-color="#B68DFF"/>
      <stop offset="1" stop-color="#A879F7"/>
    </radialGradient>

    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="150%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="frameBlur"/>
      <feOffset in="frameBlur" dx="0" dy="8" result="frameOffset"/>
      <feFlood flood-color="#000000" flood-opacity="0.35" result="frameColor"/>
      <feComposite in="frameColor" in2="frameOffset" operator="in" result="frameCast"/>
      <feMerge>
        <feMergeNode in="frameCast"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="planeShadow" x="-20%" y="-20%" width="150%" height="165%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="planeBlur"/>
      <feOffset in="planeBlur" dx="-2" dy="18" result="planeOffset"/>
      <feFlood flood-color="#050408" flood-opacity="0.9" result="planeColor"/>
      <feComposite in="planeColor" in2="planeOffset" operator="in" result="planeCast"/>
      <feMerge>
        <feMergeNode in="planeCast"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect id="background" width="2048" height="2048" fill="url(#backgroundGlow)"/>

  <!-- A faint central violet atmosphere, visible only against the dark field. -->
  <ellipse cx="1060" cy="980" rx="650" ry="690"
           fill="#7C55B8" opacity="0.018" filter="url(#softGlow)"/>

  <!-- Rounded app window outline -->
  <rect id="window-frame"
        x="580" y="683" width="751" height="784" rx="69" ry="69"
        fill="none"
        stroke="url(#frameGradient)"
        stroke-width="68"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#frameShadow)"/>

  <!-- Status dot -->
  <circle id="status-dot"
          cx="751" cy="853" r="68"
          fill="url(#dotGradient)"/>

  <!-- Paper plane. The frame continues underneath it, matching the source icon. -->
  <path id="paper-plane"
        d="M 981 659
           L 1466 548
           C 1487 543 1506 561 1501 584
           L 1381 1072
           C 1376 1091 1367 1102 1353 1100
           C 1340 1099 1331 1091 1326 1078
           L 1217 823
           L 969 709
           C 955 703 949 692 953 680
           C 956 669 966 662 981 659
           Z"
        fill="url(#purpleGradient)"
        filter="url(#planeShadow)"/>
</svg>
