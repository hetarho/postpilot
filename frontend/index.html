<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) non-zero, which the safe-b/nav spacing
         tokens in app/styles/index.css depend on. No user-scalable/maximum-scale: they are a
         WCAG 1.4.4 failure on Android and are ignored on iOS. See design-language §8.1. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Chrome for Android tints its address bar from this tag alone; color-scheme does not reach
         it. The values are the header's own plane (surface-raised) per theme — design-language
         §2.5. They are the only colour literals outside app/styles/index.css. -->
    <meta name="theme-color" content="#28272c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfbfe" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <title>Postpilot — 사진과 경험을 블로그 글로</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
