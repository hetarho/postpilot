<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) non-zero, which the safe-b/nav spacing
         tokens in app/styles/index.css depend on. No user-scalable/maximum-scale: they are a
         WCAG 1.4.4 failure on Android and are ignored on iOS. See design-language §8.1. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Chrome for Android tints its address bar from this tag alone; color-scheme does not reach
         it. The values are the header's own plane (surface-raised) per theme — design-language
         §2.5. They are the only colour literals outside app/styles/index.css. -->
    <!-- Unconditional, because `night` is the only theme that renders: index.css maps it on bare
         :root and nothing sets data-theme yet (design-language §2.5). Keying this off
         prefers-color-scheme would paint a white address bar above a near-black app for every
         light-mode user. Re-pair it the day the switcher lands, off data-theme. -->
    <meta name="theme-color" content="#28272c" />
    <meta name="color-scheme" content="dark" />
    <!-- The app icon, in the three forms a browser actually asks for. `favicon.svg` is the source
         of truth and the one every current browser picks; `favicon.ico` (16/32/48, PNG-encoded) is
         the legacy fallback and the file a browser requests from the origin root whether we link it
         or not; `apple-touch-icon.png` is what iOS uses for "홈 화면에 추가" — Safari ignores SVG
         there, and without it iOS screenshots the page instead. All three are generated from
         public/favicon.svg; regenerate the two rasters if it changes. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Postpilot — 사진과 경험을 블로그 글로</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
