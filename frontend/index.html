<!doctype html>
<html lang="ko" data-theme="night" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) non-zero, which the safe-b/nav spacing
         tokens in app/styles/index.css depend on. No user-scalable/maximum-scale: they are a
         WCAG 1.4.4 failure on Android and are ignored on iOS. See design-language §8.1. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Static/no-JS fallback is night. The synchronous theme bootstrap replaces data-theme,
         color-scheme, and both meta values from one effective-theme snapshot before React renders.
         These theme-color values are the header's surface-raised plane (design-language §2.5). -->
    <meta name="theme-color" content="#28272c" data-day="#fcfbfe" data-night="#28272c" />
    <meta name="color-scheme" content="dark" />
    <!-- The ONLY metadata a client that does not run JS ever sees — on /about as much as on
         /login, since there is no SSR or prerender and wrangler serves this same file for every
         deep link. So it stays PRODUCT-level: true of the whole app, never one route's marketing
         copy, and never an Open Graph promise the running app alone can keep. It cannot be
         localized either (the file cannot know the visitor's locale); the app replaces both values
         with the localized ones the moment it runs. -->
    <meta name="description" content="사진과 경험을 나만의 말투로 블로그 글에 옮겨 보세요." />
    <!-- The app icon, in the three forms a browser actually asks for. `favicon.svg` is the source
         of truth and the one every current browser picks; `favicon.ico` (16/32/48, PNG-encoded) is
         the legacy fallback and the file a browser requests from the origin root whether we link it
         or not; `apple-touch-icon.png` is what iOS uses for "홈 화면에 추가" — Safari ignores SVG
         there, and without it iOS screenshots the page instead. All three are generated from
         public/favicon.svg; regenerate the two rasters if it changes. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Postpilot | 사진과 경험을 블로그 글로</title>
    <script type="module" src="/src/main.tsx" blocking="render"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
