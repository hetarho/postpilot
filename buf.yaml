# buf v2 workspace. The single proto module lives in proto/ (path is relative to
# this file, so this must sit at the repo root for `modules: [{ path: proto }]`).
# Codegen runs `buf generate --template backend/buf.gen.yaml proto` (scripts/gen.mjs).
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # These unprefixed enum names are the PostContent protojson contract emitted by LLMs.
  except:
    - ENUM_VALUE_PREFIX
    # These shared response envelopes predate Job 32 and are part of the generated-client API.
    # Keep their source-compatible names instead of renaming public messages only for lint shape.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    # FailureReason's names ARE the wire values — the detail carries the name as a string
    # (T278) — so its zero value is UNKNOWN_FAILURE and cannot take an _UNSPECIFIED suffix
    # without changing what every older client reads.
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    # PACKAGE, not FILE: an rpc family may move to a file of its own, and a message may move
    # between those files, without either counting as a breaking change (ARCH-41). Only the
    # wire — a renamed field, a changed number, a moved rpc PATH — breaks.
    - PACKAGE
