syntax = "proto3";

package postpilot.v1;

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

import "postpilot/v1/provider.proto";
import "postpilot/v1/model_experiment.proto";

// plan.proto is the authorization slice of the contract: which tier an account is on,
// what it has left to spend, and the operator surface that changes it.
//
// No procedure here moves money: charging a card, the subscription's own lifecycle and
// buying credits are BILLING's and live outside this contract. What this file publishes is
// the ladder a comparison screen reads and the operator surface that assigns a tier.
service PlanService {
  // The caller's own tier, credit balance and the lots behind it. Every number the client
  // displays comes from here; the frontend never hardcodes a grant or a price.
  rpc GetMyPlan(GetMyPlanRequest) returns (GetMyPlanResponse) {}
}

// AdminService is master-only, enforced by the auth interceptor rather than by these
// handlers — a new admin procedure is therefore closed until it is added to that set.
service AdminService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}
  rpc SetUserPlan(SetUserPlanRequest) returns (SetUserPlanResponse) {}
  // Assign the two models one estimator combo prices with. Both are curated model ids and
  // both must be registered to the purpose they serve; the assignment is what makes a combo
  // appear in GetMyPlan at all.
  rpc SetEstimatorCombo(SetEstimatorComboRequest) returns (SetEstimatorComboResponse) {}
  // The rate a paid job admitted now would be priced at, for the operator's 비용·환율 tab
  // (QUOTA-65). Customer reads carry no rate, master included.
  rpc GetExchangeRate(GetExchangeRateRequest) returns (GetExchangeRateResponse) {}
  // Provider spend is visible only in the operator's 비용·환율 tab (MODEL-39).
  rpc ListComparisonCosts(ListComparisonCostsRequest) returns (ListComparisonCostsResponse) {}
}

// The ladder carries the five commercial offers and the operator-only master tier.
// Model rights follow the offer's ceiling and a separate affordability check.
//
// PLAN_PRO is numbered after the original four rather than between them: enum numbers are
// wire identity, and renumbering PLAN_MAX would silently change the tier of every account
// a stale client reads.
enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_BASIC = 2;
  PLAN_MAX = 3;
  PLAN_MASTER = 4;
  PLAN_PRO = 5;
  PLAN_LIGHT = 6;
}

// One grant of credits. Lots arrive in the order they are spent (QUOTA-12): every expiring
// lot by expiry ascending, then never-expiring bonus, then purchased — which is why a client
// can render that order without knowing the rule.
message CreditLot {
  // "monthly", "bonus", "purchased" or "voucher". A display distinction: the balance itself
  // does not care.
  string kind = 1;
  int32 granted = 2;
  int32 remaining = 3;
  // RFC3339, or empty for a grant that does not expire.
  string expires_at = 4;
  string coverage_id = 5;
  string window_start = 6;
  string issuance_cause = 7;
}

// The account's spendable position. Credits are integers — the server never sends a
// currency, because the credit IS the unit the product prices in.
message CreditBalance {
  int32 credits = 1;
  // True for the operator tier, which is never refused for balance. `credits` is then
  // meaningless and the client shows no meter.
  bool unlimited = 2;
  repeated CreditLot lots = 3;
  // RFC3339 instant of the next paid credit reset.
  string renews_at = 4;
  reserved 5;
  reserved "monthly_grant";
  int32 daily_grant = 6;
  int32 monthly_bonus = 7;
  string daily_resets_at = 8;
  string bonus_resets_at = 9;
  string coverage_id = 10;
  string coverage_ends_at = 11;
  string benefit_window_start = 12;
  string benefit_window_end = 13;
}

message ServerExportWindow {
  string coverage_id = 1;
  string starts_at = 2;
  string ends_at = 3;
  int32 allowance = 4;
  int32 used = 5;
  int32 reserved = 6;
  int32 remaining = 7;
}

// The rate paid AI work is priced at, read only on the operator's 비용·환율 tab (QUOTA-65).
message PlanFXRate {
  string source = 1;
  string publication_date = 2;
  int64 reference_e4 = 3;
  int64 applied_e4 = 4;
  bool temporary = 5;
}

message GetExchangeRateRequest {}

message GetExchangeRateResponse {
  // Absent when `unavailable`.
  PlanFXRate rate = 1;
  // No eligible rate: new paid AI work cannot start until one is confirmed (QUOTA-59).
  bool unavailable = 2;
}

message ListComparisonCostsRequest {
  Stage stage = 1;
  LeaderboardWindow window = 2;
}

message ComparisonCostRow {
  ModelRef model = 1;
  string model_label = 2;
  int32 evaluated_comparisons = 3;
  int64 total_cost_microusd = 4;
  CostSource cost_quality = 5;
}

message ListComparisonCostsResponse { repeated ComparisonCostRow rows = 1; }


// One rung as a plan comparison screen lists it.
message PlanOffer {
  Plan plan = 1;
  reserved 2, 3;
  reserved "monthly_credits", "price_usd_cents";
  // 4 held a fixed reference case's post count. The estimate is now proportional to what
  // the reader says they will do, so it is computed from EstimatorCombo's rates instead.
  reserved 4;
  // True for the one rung the comparison screen marks. Which rung that is belongs beside the
  // grants it compares, not in the client.
  bool recommended = 5;
  // Fixed, VAT-inclusive product amounts. These do not depend on the AI FX rate.
  int32 monthly_krw = 6;
  int32 annual_krw = 7;
  int32 daily_credits = 8;
  int32 monthly_bonus = 9;
  // "none", "value", "balanced", "premium" or "top".
  string model_ceiling = 10;
  int32 monthly_server_exports = 11;
}

message CreditPack {
  int32 price_krw = 1;
  int32 credits = 2;
  string id = 3;
}

// One estimator combo: a pair of models the operator assigned to a price tier, reduced to
// the unit rates a comparison screen multiplies (QUOTA-40).
//
// A level prices one post as post_credits (QUOTA-64); a grant covers `floor(credits / that)`
// posts. Clip rates stay MILLI-credits so a client stays in integers.
//
// A comparison names the combo, never the models behind it (QUOTA-39, QUOTA-68).
message EstimatorCombo {
  // One of the model levels `value` `balanced` `premium` `top`.
  string combo = 1;
  // The model labels reached only master, on a customer screen that never showed them (QUOTA-68).
  reserved 2, 3;
  reserved "observe_label", "write_label";
  // Blog rates became post_credits from recent usage (QUOTA-64).
  reserved 4, 5, 6, 7;
  reserved "per_photo_milli", "per_video_milli", "per_thousand_chars_milli", "per_post_base_milli";
  // Absent when this pair cannot price video observation and structured writing.
  ClipEstimatorRates clip_rates = 8;
  // One post with photos on this level's assigned pair: its observe and write figures summed,
  // an estimate when either part is (QUOTA-64). Zero with UNSPECIFIED when either is missing.
  int32 post_credits = 9;
  PostCreditsBasis post_credits_basis = 10;
}

// A clip costs base + sources * per_source + finished_seconds * per_output_second.
// Includes observation, flow, narration and the 1.5x token allowance (QUOTA-57).
message ClipEstimatorRates {
  int32 per_source_milli = 1;
  int32 per_output_second_milli = 2;
  int32 per_clip_base_milli = 3;
}

message GetMyPlanRequest {}

message GetMyPlanResponse {
  Plan plan = 1;
  CreditBalance balance = 2;
  // Every rung on offer, so the comparison screen renders no number of its own. `master`
  // is absent: it is the operator tier, not something anyone is offered.
  repeated PlanOffer offers = 3;
  // The combos the operator has assigned, in ladder order. Empty when none is assigned or
  // when the models behind them are no longer curated — a comparison then shows the grants
  // with no post estimate rather than a figure nobody stands behind.
  repeated EstimatorCombo estimator_combos = 4;
  // Assumed duration of EACH original video, independent of finished clip length.
  int32 clip_source_seconds = 5;
  repeated CreditPack credit_packs = 6;
  ServerExportWindow server_export_window = 7;
  // The rate behind credits is read on the operator's 비용·환율 tab, never here (QUOTA-65).
  reserved 8;
  reserved "fx_rate";
  bool fx_unavailable = 9;
}

message SetEstimatorComboRequest {
  // One of the model levels `value` `balanced` `premium` `top`.
  string combo = 1;
  // Curated model ids. The observe model must be registered to `photo-analysis` at the
  // combo's level and the write model to `writing` at the combo's level.
  string observe_model_id = 2;
  string write_model_id = 3;
}

message SetEstimatorComboResponse {}

message ListUsersRequest {}

message ListUsersResponse {
  repeated PlanUser users = 1;
}

// PlanUser is an account as the admin screen sees it. There is still no display name or
// email to show (PRD §1) — an id, a tier, and when it was provisioned.
message PlanUser {
  string id = 1;
  Plan plan = 2;
  string created_at = 3;
}

message SetUserPlanRequest {
  string user_id = 1;
  Plan plan = 2;
}

message SetUserPlanResponse {
  PlanUser user = 1;
}
