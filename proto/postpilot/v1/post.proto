syntax = "proto3";

package postpilot.v1;

import "postpilot/v1/provider.proto";
import "postpilot/v1/purpose.proto";
import "postpilot/v1/error.proto";
import "postpilot/v1/language.proto";

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

// post.proto is the drafting slice: a post, its photos, and the upload handshake that
// puts a photo in object storage without the API ever touching the bytes.
//
// Every procedure is scoped to the acting user from the session — no request carries a
// user id, because a user id in a message is a claim by the caller, not a fact.
service PostService {
  // Create-or-update. An empty slug creates the post and returns the minted one.
  rpc SavePostDraft(SavePostDraftRequest) returns (SavePostDraftResponse) {}
  // Optimistic manual save. It never changes the machine baseline.
  rpc SavePostContent(SavePostContentRequest) returns (SavePostContentResponse) {}
  rpc SavePostGenerationOptions(SavePostGenerationOptionsRequest) returns (SavePostGenerationOptionsResponse) {}
  rpc FinalizePost(FinalizePostRequest) returns (FinalizePostResponse) {}
  rpc GetPost(GetPostRequest) returns (GetPostResponse) {}
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse) {}
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse) {}

  // Step 1 of the upload handshake: hands back a presigned PUT the BROWSER uses.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse) {}
  // Step 2: the server verifies the object landed, then records the photo.
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse) {}
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse) {}
}

service GenerationService {
  rpc StartGeneration(StartGenerationRequest) returns (StartGenerationResponse) {}
  rpc StartRevision(StartRevisionRequest) returns (StartRevisionResponse) {}
  rpc GetGeneration(GetGenerationRequest) returns (GetGenerationResponse) {}
}

enum BlockType {
  BLOCK_TYPE_UNSPECIFIED = 0;
  TEXT = 1;
  HEADING = 2;
  IMAGE = 3;
  QUOTE = 4;
  LIST = 5;
}

message Block {
  BlockType type = 1;
  string content = 2;
  int32 level = 3;
  string file = 4;
  string alt = 5;
  string caption = 6;
  repeated string items = 7;
}

message PostContent {
  string title = 1;
  string summary = 2;
  repeated string tags = 3;
  repeated Block blocks = 4;
}

message Observation {
  string file = 1;
  string scene = 2;
  string mood = 3;
  string visible_text = 4;
  repeated string objects = 5;
  bool people_present = 6;
  // The model ref that produced THIS entry. Per-entry rather than per-snapshot because
  // re-observing a subset of the photos is what makes a mixed-model snapshot possible.
  // Empty on an entry written before the field existed, which reads as unknown.
  string model = 7;
}

// The voice a post is written in, as the post screens need it. Transport-only: a deleted
// voice still names itself here so a post assigned to it stays readable and exportable
// while every AI action refuses.
message VoiceRef {
  string id = 1;
  string name = 2;
  bool deleted = 3;
  ContentLanguage source_language = 4;
}

message Post {
  // Minted once from the date and title, then immutable — it is the primary key and it
  // appears in object keys, so retitling must not move it.
  string slug = 1;
  string title = 2;
  string memo = 3;
  // draft | review | finalized. Machine output moves it to review; only FinalizePost finalizes it.
  string status = 4;
  repeated Image images = 5;
  string created_at = 6;
  string updated_at = 7;
  GenerationJob active_job = 8;
  PostContent content = 9;
  repeated Observation observations = 10;
  string pending_experiment_id = 11;
  int64 content_revision = 12;
  int64 machine_baseline_revision = 13;
  bool can_finalize = 14;
  optional int32 target_length = 15;
  int64 finalized_revision = 16;
  string finalized_at = 17;
  VoiceRef voice = 18;
  // The voice the latest machine baseline was written under. Finalization learning refuses
  // unless it still equals `voice`, so a reassigned post cannot publish to the wrong voice.
  string machine_baseline_voice_id = 19;
  // Unset when the post has no purpose. Unlike `voice` it is optional by design: the
  // server never picks one and 없음 is the default.
  PurposeRef purpose = 20;
  ContentLanguage target_language = 21;
  // UNSPECIFIED until canonical machine content establishes provenance.
  ContentLanguage content_language = 22;
}

message Image {
  string id = 1;
  // The name the model and the exporters refer to this photo by. Unique within a post.
  string filename = 2;
  // Measured in the browser — the server never decodes an image ([I6]).
  int32 width = 3;
  int32 height = 4;
  // From the storage HEAD at confirm time, not from the client.
  int64 bytes = 5;
  // A short-lived presigned GET, minted fresh on every GetPost. The client must not
  // persist it; the bucket is private and this is the only way in.
  string view_url = 6;
}

message PostSummary {
  string slug = 1;
  string title = 2;
  string status = 3;
  string updated_at = 4;
  GenerationJob active_job = 5;
  string pending_experiment_id = 6;
  VoiceRef voice = 7;
  PurposeRef purpose = 8;
  ContentLanguage target_language = 9;
  ContentLanguage content_language = 10;
}

message GenerationJob {
  string id = 1;
  string kind = 2;
  string status = 3;
  string stage = 4;
  int32 progress_done = 5;
  int32 progress_total = 6;
  string error = 7 [deprecated = true];
  string post_slug = 8;
  ModelRef observe_model = 9;
  ModelRef write_model = 10;
  string created_at = 11;
  string updated_at = 12;
  ContentLanguage target_language = 13;
  Failure failure = 14;
}

message GetGenerationRequest {
  string id = 1;
}

message GetGenerationResponse {
  GenerationJob job = 1;
}

// The re-observation picker's answer. It is a MESSAGE rather than a bare `repeated string`
// because presence is the contract and proto3 gives a repeated field none: absent and empty
// arrive identically. Absent means no picker was involved and every attached photo is
// observed, which is what a client predating the picker sends and what the pre-picker
// behavior was; present with an empty `files` is the frozen decision to observe nothing at
// all — reuse every stored observation.
//
// Only the SET of filenames travels. The observations being carried over are resolved
// server-side from the post's own snapshot at enqueue, so a client never sends observation
// text and both halves of the decision freeze in one place.
message ReobserveSelection {
  repeated string files = 1;
}

message StartGenerationRequest {
  string post_slug = 1;
  ModelRef observe_model = 2;
  ModelRef write_model = 3;
  optional int32 target_length = 4;
  ReobserveSelection reobserve = 5;
}

message StartGenerationResponse { string job_id = 1; }

message StartRevisionRequest {
  string post_slug = 1;
  string instruction = 2;
  bool save_as_rule = 3;
  ModelRef write_model = 4;
}

message StartRevisionResponse {
  string job_id = 1;
}

message SavePostDraftRequest {
  // Empty on the first save of a new post.
  string slug = 1;
  string title = 2;
  string memo = 3;
  // Presence decides the meaning, which is what lets autosave keep patching: required on
  // create, absent preserves the current assignment, and a different present value asks for
  // a reassignment. An empty string is never valid — the server substitutes no default.
  optional string voice_id = 4;
  // Presence decides the meaning here too, but with one more case than voice_id, because a
  // post may legitimately have none: absent preserves the current assignment (what ordinary
  // autosave sends), an empty string clears it, and a non-empty value assigns that purpose.
  // An unknown or foreign id is refused and nothing else in the request is applied.
  optional string purpose_id = 5;
  // Required on create; absent preserves the stored target on an update.
  optional ContentLanguage target_language = 6;
}

message SavePostDraftResponse {
  Post post = 1;
}

message SavePostContentRequest {
  string slug = 1;
  PostContent content = 2;
  int64 expected_revision = 3;
  reserved 4;
}

message SavePostContentResponse { Post post = 1; }

message SavePostGenerationOptionsRequest {
  string slug = 1;
  optional int32 target_length = 2;
}
message SavePostGenerationOptionsResponse { Post post = 1; }

message FinalizePostRequest {
  string slug = 1;
  int64 expected_revision = 2;
}
message FinalizePostResponse { Post post = 1; }

message GetPostRequest {
  string slug = 1;
}

message GetPostResponse {
  Post post = 1;
}

message ListPostsRequest {}

message ListPostsResponse {
  // Newest first.
  repeated PostSummary posts = 1;
}

message DeletePostRequest { string slug = 1; }
message DeletePostResponse {}

message CreateUploadRequest {
  string post_slug = 1;
  string filename = 2;
}

message CreateUploadResponse {
  string upload_id = 1;
  // Presigned PUT on the storage host, never on this API.
  string put_url = 2;
  // The Content-Type the PUT must send. It is part of the signature, so a different
  // value is rejected as a signature mismatch rather than as a bad request.
  string content_type = 3;
  string expires_at = 4;
}

message ConfirmUploadRequest {
  string upload_id = 1;
  int32 width = 2;
  int32 height = 3;
}

message ConfirmUploadResponse {
  Image image = 1;
}

message DeleteImageRequest {
  string image_id = 1;
}

message DeleteImageResponse {}
