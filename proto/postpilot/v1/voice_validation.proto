syntax = "proto3";
package postpilot.v1;
import "postpilot/v1/provider.proto";
option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

service VoiceValidationService {
  rpc StartVoiceRuleComparison(StartVoiceRuleComparisonRequest) returns (StartVoiceRuleComparisonResponse) {}
  rpc GetVoiceRuleComparison(GetVoiceRuleComparisonRequest) returns (GetVoiceRuleComparisonResponse) {}
  rpc DecideVoiceRuleComparison(DecideVoiceRuleComparisonRequest) returns (DecideVoiceRuleComparisonResponse) {}
  rpc RetryVoiceRuleComparison(RetryVoiceRuleComparisonRequest) returns (RetryVoiceRuleComparisonResponse) {}
  rpc StartVoiceProfileValidation(StartVoiceProfileValidationRequest) returns (StartVoiceProfileValidationResponse) {}
  rpc GetVoiceProfileValidation(GetVoiceProfileValidationRequest) returns (GetVoiceProfileValidationResponse) {}
  rpc ListVoiceProfileValidations(ListVoiceProfileValidationsRequest) returns (ListVoiceProfileValidationsResponse) {}
  rpc RetryVoiceProfileValidation(RetryVoiceProfileValidationRequest) returns (RetryVoiceProfileValidationResponse) {}
}

message VoiceComparisonCandidate { string id = 1; string side = 2; string output = 3; string status = 4; string error = 5; }
message VoiceRuleComparison {
  string id = 1; string rule_id = 2; int64 profile_version = 3; int32 target_length = 4;
  string status = 5; string job_id = 6; repeated VoiceComparisonCandidate candidates = 7;
  string chosen_side = 8; string created_at = 9;
}
message StartVoiceRuleComparisonRequest {
  string rule_id = 1; string source_id = 2; int32 target_length = 3; ModelRef write_model = 4;
}
message StartVoiceRuleComparisonResponse { string comparison_id = 1; string job_id = 2; }
message GetVoiceRuleComparisonRequest { string comparison_id = 1; }
message GetVoiceRuleComparisonResponse { VoiceRuleComparison comparison = 1; }
message DecideVoiceRuleComparisonRequest { string comparison_id = 1; string chosen_side = 2; }
message DecideVoiceRuleComparisonResponse { VoiceRuleComparison comparison = 1; }
message RetryVoiceRuleComparisonRequest { string comparison_id = 1; }
message RetryVoiceRuleComparisonResponse { string job_id = 1; }

message VoiceValidationScore { string dimension = 1; bool matched = 2; }
message VoiceValidationItem {
  string id = 1; string source_id = 2; string original = 3; string neutral_summary = 4;
  string regenerated = 5; repeated VoiceValidationScore scores = 6; string status = 7; string error = 8;
}
message VoiceProfileValidation {
  string id = 1; int64 profile_version = 2; bool judge_enabled = 3; string status = 4;
  string job_id = 5; repeated VoiceValidationItem items = 6; int32 y_count = 7; int32 total_count = 8;
  string created_at = 9; string finished_at = 10;
}
message StartVoiceProfileValidationRequest { ModelRef analyze_model = 1; ModelRef write_model = 2; bool judge_enabled = 3; }
message StartVoiceProfileValidationResponse { string validation_id = 1; string job_id = 2; }
message GetVoiceProfileValidationRequest { string validation_id = 1; }
message GetVoiceProfileValidationResponse { VoiceProfileValidation validation = 1; }
message ListVoiceProfileValidationsRequest {}
message ListVoiceProfileValidationsResponse { repeated VoiceProfileValidation validations = 1; }
message RetryVoiceProfileValidationRequest { string validation_id = 1; }
message RetryVoiceProfileValidationResponse { string job_id = 1; }
