syntax = "proto3";

package postpilot.v1;

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

// purpose.proto is the 용도 slice: reusable account-owned briefs saying what kind of text
// a post is and how that kind must be written. A purpose is authored text only — nothing
// here is learned, inferred, or written by a model, and no procedure enqueues work.
//
// Every procedure is scoped to the acting user from the session — no request carries a
// user id, because a user id in a message is a claim by the caller, not a fact.
service PurposeService {
  rpc ListPurposes(ListPurposesRequest) returns (ListPurposesResponse) {}
  rpc CreatePurpose(CreatePurposeRequest) returns (CreatePurposeResponse) {}
  rpc UpdatePurpose(UpdatePurposeRequest) returns (UpdatePurposeResponse) {}
  rpc DeletePurpose(DeletePurposeRequest) returns (DeletePurposeResponse) {}
}

message Purpose {
  string id = 1;
  string name = 2;
  // What posts of this kind are for. May be empty; injected as the 이 글의 용도 line.
  string description = 3;
  // How to write them. The multi-line brief injected verbatim after the voice profile.
  string instructions = 4;
  // Posts currently referencing it. Shown before a delete, which detaches rather than
  // cascading — it is a projection, so it is never accepted on a write.
  int32 post_count = 5;
  string created_at = 6;
  string updated_at = 7;
}

// The purpose a post is written for, as the post screens need it. Transport-only, and
// unset when the post has none: 없음 is a real answer, not a missing one.
message PurposeRef {
  string id = 1;
  string name = 2;
}

message ListPurposesRequest {}
message ListPurposesResponse {
  // By name, then id.
  repeated Purpose purposes = 1;
}

message CreatePurposeRequest {
  string name = 1;
  string description = 2;
  string instructions = 3;
}
message CreatePurposeResponse { Purpose purpose = 1; }

// Field presence is the edit unit, as it is for UpdateVoiceProfile: only the supplied
// fields change, so two fields edited from two tabs cannot overwrite each other.
message UpdatePurposeRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string instructions = 4;
}
message UpdatePurposeResponse { Purpose purpose = 1; }

message DeletePurposeRequest { string id = 1; }
message DeletePurposeResponse {
  // Posts whose assignment was cleared by this delete, in the same transaction. No post
  // or content is deleted, and frozen job/experiment payloads keep the brief's text.
  int32 detached_posts = 1;
}
