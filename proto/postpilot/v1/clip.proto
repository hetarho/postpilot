syntax = "proto3";
package postpilot.v1;
option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

import "postpilot/v1/post.proto";
import "postpilot/v1/provider.proto";

// All procedures derive the owner from the authenticated session.
service ClipService {
  rpc SaveClipEditPlan(SaveClipEditPlanRequest) returns (SaveClipEditPlanResponse) {}
  rpc StartClipRender(StartClipRenderRequest) returns (StartClipRenderResponse) {}
  rpc StartClipGeneration(StartClipGenerationRequest) returns (StartClipGenerationResponse) {}
  rpc ListVideoTemplates(ListVideoTemplatesRequest) returns (ListVideoTemplatesResponse) {}
  rpc CreateVideoTemplate(CreateVideoTemplateRequest) returns (CreateVideoTemplateResponse) {}
  rpc UpdateVideoTemplate(UpdateVideoTemplateRequest) returns (UpdateVideoTemplateResponse) {}
  rpc DeleteVideoTemplate(DeleteVideoTemplateRequest) returns (DeleteVideoTemplateResponse) {}
  rpc ListClipProjects(ListClipProjectsRequest) returns (ListClipProjectsResponse) {}
  rpc CreateClipProject(CreateClipProjectRequest) returns (CreateClipProjectResponse) {}
  rpc GetClipProject(GetClipProjectRequest) returns (GetClipProjectResponse) {}
  rpc UpdateClipProject(UpdateClipProjectRequest) returns (UpdateClipProjectResponse) {}
  rpc DeleteClipProject(DeleteClipProjectRequest) returns (DeleteClipProjectResponse) {}
  rpc CreateClipSourceBatch(CreateClipSourceBatchRequest) returns (CreateClipSourceBatchResponse) {}
  rpc ConfirmClipSource(ConfirmClipSourceRequest) returns (ConfirmClipSourceResponse) {}
  rpc DiscardClipSourceBatch(DiscardClipSourceBatchRequest) returns (DiscardClipSourceBatchResponse) {}
}
message ClipInformationField { string label = 1; string prompt = 2; }
message ClipInformationFields { repeated ClipInformationField values = 1; }
// Stable style ids: clean, diary, emphasis.
message ClipCopyStyles { repeated string values = 1; }
message VideoTemplate {
  string id = 1;
  string name = 2;
  repeated ClipInformationField information_fields = 3;
  string cut_guidance = 4;
  repeated string copy_styles = 5;
  // Empty is neutral; otherwise coral, amber, lime, teal, blue, violet or pink.
  string accent = 6;
  int32 project_count = 7;
  string created_at = 8;
  string updated_at = 9;
}
message ClipAnswer { string label = 1; string text = 2; }
message ClipResult {
  string content_type = 1;
  int64 bytes = 2;
  int32 duration_ms = 3;
  string created_at = 4;
  string view_url = 5;
  string download_url = 6;
}
message ClipProject {
  string id = 1;
  string title = 2;
  string video_template_id = 3;
  // Exactly vertical, horizontal or square; immutable after creation.
  string ratio = 4;
  int32 target_duration_ms = 5;
  repeated ClipAnswer answers = 6;
  ClipResult result = 7;
  int32 edit_plan_revision = 8;
  int32 rendered_plan_revision = 9;
  string created_at = 10;
  string updated_at = 11;
  GenerationJob latest_job = 12;
  // Detail only: retained metadata and a structured correction draft, never source URLs.
  ClipEditingState editing = 13;
}
message ListVideoTemplatesRequest {}
message ListVideoTemplatesResponse { repeated VideoTemplate templates = 1; }
message CreateVideoTemplateRequest {
  string name = 1;
  repeated ClipInformationField information_fields = 2;
  string cut_guidance = 3;
  repeated string copy_styles = 4;
  string accent = 5;
}
message CreateVideoTemplateResponse { VideoTemplate template = 1; }
message UpdateVideoTemplateRequest {
  string id = 1;
  optional string name = 2;
  ClipInformationFields information_fields = 3;
  optional string cut_guidance = 4;
  ClipCopyStyles copy_styles = 5;
  optional string accent = 6;
}
message UpdateVideoTemplateResponse { VideoTemplate template = 1; }
message DeleteVideoTemplateRequest { string id = 1; }
message DeleteVideoTemplateResponse { int32 detached_projects = 1; }
message ListClipProjectsRequest {}
message ListClipProjectsResponse { repeated ClipProject projects = 1; }
message CreateClipProjectRequest {
  string title = 1;
  string video_template_id = 2;
  string ratio = 3;
  int32 target_duration_ms = 4;
  repeated ClipAnswer answers = 5;
}
message CreateClipProjectResponse { ClipProject project = 1; }
message GetClipProjectRequest { string id = 1; }
message GetClipProjectResponse { ClipProject project = 1; }
message UpdateClipProjectRequest {
  string id = 1;
  optional string title = 2;
  optional string video_template_id = 3;
  optional int32 target_duration_ms = 4;
  // Only supplied labels change; an empty text explicitly clears that answer.
  repeated ClipAnswer answers = 5;
}
message UpdateClipProjectResponse { ClipProject project = 1; }
message DeleteClipProjectRequest { string id = 1; }
message DeleteClipProjectResponse {}
// Source bytes travel directly to object storage, never in an RPC body.
message ClipSourceMetadata {
  string filename = 1;
  string content_type = 2;
  int64 bytes = 3;
  int32 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
  string fingerprint = 7;
}
message ClipSource {
  string id = 1;
  ClipSourceMetadata metadata = 2;
  string state = 3;
  int64 actual_bytes = 4;
}
message ClipSourceBatch {
  string id = 1;
  string project_id = 2;
  string state = 3;
  repeated ClipSource sources = 4;
  string expires_at = 5;
}
message ClipSourceUpload {
  string source_id = 1;
  string put_url = 2;
  map<string,string> headers = 3;
  string expires_at = 4;
}
message CreateClipSourceBatchRequest { string project_id = 1; repeated ClipSourceMetadata sources = 2; }
message CreateClipSourceBatchResponse { ClipSourceBatch batch = 1; repeated ClipSourceUpload uploads = 2; }
message ConfirmClipSourceRequest { string batch_id = 1; string source_id = 2; }
message ConfirmClipSourceResponse { ClipSourceBatch batch = 1; }
message DiscardClipSourceBatchRequest { string batch_id = 1; }
message DiscardClipSourceBatchResponse {}
message StartClipGenerationRequest {
  string project_id = 1;
  string batch_id = 2;
  ModelRef observe_model = 3;
  ModelRef write_model = 4;
}
message StartClipGenerationResponse { string job_id = 1; }
message ClipCaption {
  string text = 1;
  string position = 2;
  string style = 3;
  string accent = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
}
message ClipEditCut {
  string id = 1;
  string source_id = 2;
  string fingerprint = 3;
  int32 start_ms = 4;
  int32 end_ms = 5;
  ClipCaption copy = 6;
  int32 volume_permille = 7;
}
message ClipEditPlan { int32 duration_ms = 1; repeated ClipEditCut cuts = 2; }
message ClipRetainedSource {
  string id = 1;
  string fingerprint = 2;
  string filename = 3;
  int32 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
}
message ClipEditingState {
  ClipEditPlan plan = 1;
  repeated ClipRetainedSource sources = 2;
  repeated string copy_styles = 3;
  int32 fade_ms = 4;
  int32 max_cuts = 5;
  int32 max_copy_runes = 6;
  int32 min_duration_ms = 7;
  int32 max_duration_ms = 8;
}
message SaveClipEditPlanRequest { string project_id = 1; int32 expected_revision = 2; ClipEditPlan plan = 3; }
message SaveClipEditPlanResponse { ClipProject project = 1; }
message StartClipRenderRequest { string project_id = 1; int32 expected_revision = 2; string batch_id = 3; }
message StartClipRenderResponse { string job_id = 1; }
