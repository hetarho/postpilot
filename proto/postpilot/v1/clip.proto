syntax = "proto3";
package postpilot.v1;
option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

import "postpilot/v1/post.proto";
import "postpilot/v1/provider.proto";

// All procedures derive the owner from the authenticated session.
service ClipService {
  rpc PrepareClipPreview(PrepareClipPreviewRequest) returns (PrepareClipPreviewResponse) {}
  rpc GetClipCapabilities(GetClipCapabilitiesRequest) returns (GetClipCapabilitiesResponse) {}
  rpc SaveClipEditPlan(SaveClipEditPlanRequest) returns (SaveClipEditPlanResponse) {}
  rpc StartClipRender(StartClipRenderRequest) returns (StartClipRenderResponse) {}
  rpc StartClipGeneration(StartClipGenerationRequest) returns (StartClipGenerationResponse) {}
  rpc QuoteClipGeneration(QuoteClipGenerationRequest) returns (QuoteClipGenerationResponse) {}
  rpc ListVideoTemplates(ListVideoTemplatesRequest) returns (ListVideoTemplatesResponse) {}
  rpc CreateVideoTemplate(CreateVideoTemplateRequest) returns (CreateVideoTemplateResponse) {}
  rpc UpdateVideoTemplate(UpdateVideoTemplateRequest) returns (UpdateVideoTemplateResponse) {}
  rpc DeleteVideoTemplate(DeleteVideoTemplateRequest) returns (DeleteVideoTemplateResponse) {}
  rpc SeedPresetFields(SeedPresetFieldsRequest) returns (SeedPresetFieldsResponse) {}
  rpc ListClipProjects(ListClipProjectsRequest) returns (ListClipProjectsResponse) {}
  rpc CreateClipProject(CreateClipProjectRequest) returns (CreateClipProjectResponse) {}
  rpc GetClipProject(GetClipProjectRequest) returns (GetClipProjectResponse) {}
  rpc UpdateClipProject(UpdateClipProjectRequest) returns (UpdateClipProjectResponse) {}
  rpc DeleteClipProject(DeleteClipProjectRequest) returns (DeleteClipProjectResponse) {}
  rpc CreateClipSourceBatch(CreateClipSourceBatchRequest) returns (CreateClipSourceBatchResponse) {}
  rpc ConfirmClipSource(ConfirmClipSourceRequest) returns (ConfirmClipSourceResponse) {}
  rpc DiscardClipSourceBatch(DiscardClipSourceBatchRequest) returns (DiscardClipSourceBatchResponse) {}
  rpc GetClipSources(GetClipSourcesRequest) returns (GetClipSourcesResponse) {}
  rpc GetClipSourcePlayback(GetClipSourcePlaybackRequest) returns (GetClipSourcePlaybackResponse) {}
  // Read-only: every registered observe model with its current clip-analysis
  // eligibility (CLIP-30, CLIP-44). No model call, no write, no provider detail.
  rpc ListClipAnalysisEligibility(ListClipAnalysisEligibilityRequest) returns (ListClipAnalysisEligibilityResponse) {}
}

// Exactly one answer per model. UNSPECIFIED is a missing value, never eligible.
enum ClipAnalysisEligibility {
  CLIP_ANALYSIS_ELIGIBILITY_UNSPECIFIED = 0;
  CLIP_ANALYSIS_ELIGIBILITY_ELIGIBLE = 1;
  CLIP_ANALYSIS_ELIGIBILITY_VIDEO_INPUT_ABSENT = 2;
  CLIP_ANALYSIS_ELIGIBILITY_INLINE_ENDPOINT_UNAVAILABLE = 3;
  CLIP_ANALYSIS_ELIGIBILITY_REQUIRED_PARAMETERS_UNSUPPORTED = 4;
  CLIP_ANALYSIS_ELIGIBILITY_PRICE_CEILING_UNAVAILABLE = 5;
}
message ClipAnalysisModelEligibility {
  ModelRef model = 1;
  ClipAnalysisEligibility status = 2;
}
message ListClipAnalysisEligibilityRequest {}
// Registry order; display metadata is the observe model list's (ProviderService).
message ListClipAnalysisEligibilityResponse { repeated ClipAnalysisModelEligibility models = 1; }
message ClipInformationField { string label = 1; string prompt = 2; }
message ClipInformationFields { repeated ClipInformationField values = 1; }
// Stable style ids, one per role: clean (깔끔하게) narrative, memo (메모) fact,
// bold (크게 강조) emotion and hook, mark (형광펜) one number or keyword. A
// template's approved set always contains clean: every fallback lands on it.
message ClipCopyStyles { repeated string values = 1; }
message VideoTemplate {
  string id = 1;
  string name = 2;
  repeated ClipInformationField information_fields = 3;
  string cut_guidance = 4;
  repeated string copy_styles = 5;
  // Empty is neutral; otherwise coral, amber, lime, teal, blue, violet or pink.
  string accent = 6;
  int32 project_count = 7;
  string created_at = 8;
  string updated_at = 9;
  // The category preset: restaurant, cafe, stay, beauty or home. Empty is a
  // template written before presets existed and reads as the shared defaults.
  string preset = 10;
  // Empty or steady keeps sentence timing; rapid splits short phrase cues.
  string caption_pace = 11;
  string composition_body = 12;
  bool composition_legacy = 13;
}
message ClipAnswer { string label = 1; string text = 2; }
// The reserved information fields a preset needs, in the order a form shows
// them. Labels are exact Korean and the prompts are code-owned.
message SeedPresetFieldsRequest { string preset = 1; }
message SeedPresetFieldsResponse { repeated ClipInformationField fields = 1; }
message ClipResult {
  string content_type = 1;
  int64 bytes = 2;
  int32 duration_ms = 3;
  string created_at = 4;
  string view_url = 5;
  string download_url = 6;
}
message ClipProject {
  string id = 1;
  string title = 2;
  string video_template_id = 3;
  // Exactly vertical, horizontal or square; immutable after creation.
  string ratio = 4;
  int32 target_duration_ms = 5;
  repeated ClipAnswer answers = 6;
  ClipResult result = 7;
  int32 edit_plan_revision = 8;
  int32 rendered_plan_revision = 9;
  string created_at = 10;
  string updated_at = 11;
  GenerationJob latest_job = 12;
  // Detail only: retained metadata and a structured correction draft, never source URLs.
  ClipEditingState editing = 13;
  ClipAccounting accounting = 14;
  // The owner's campaign type (ad | sponsored | provided | paid | self) and the
  // closing call to action (blog | place | save, or empty for the preset's).
  // The phrases are code-owned: only these ids travel.
  string disclosure = 16;
  string cta = 17;
  // Independent visibility choice; older projects/clients keep the badge shown.
  bool hide_disclosure = 18;
  // Owner-only, byte-free identity for reconciling an ambiguous start response.
  ClipAttempt latest_attempt = 15;
  // Detail only: recorded observations from the latest successful generation.
  ClipObservations observations = 19;
  ClipProjectComposition composition = 20;
}
message ClipObservations {
  // available | empty | unavailable; older servers omit this message.
  string status = 1;
  repeated ClipSourceObservation sources = 2;
}
message ClipSourceObservation {
  ClipRetainedSource source = 1;
  repeated ClipObservedSegment segments = 2;
}
message ClipObservedSegment {
  int32 start_ms = 1;
  int32 end_ms = 2;
  string event = 3;
  repeated string subjects = 4;
  string speech = 5;
  string quality = 6;
}
message ClipAttempt {
  string job_id = 1;
  string batch_id = 2;
  string quote_id = 3;
}
message ClipAccounting {
  string job_id = 1;
  // not_reserved | reserved | settling | settled | exempt | unavailable
  string status = 2;
  optional int32 approved_max_credits = 3;
  optional int32 reserved_credits = 4;
  optional int32 final_charge_credits = 5;
  optional int32 refund_credits = 6;
  optional int32 shadow_charge_credits = 7;
  bool settled = 8;
}
message ListVideoTemplatesRequest {}
message ListVideoTemplatesResponse { repeated VideoTemplate templates = 1; }
message CreateVideoTemplateRequest {
  string name = 1;
  repeated ClipInformationField information_fields = 2;
  string cut_guidance = 3;
  repeated string copy_styles = 4;
  string accent = 5;
  // Required on create: one of the five presets.
  string preset = 6;
  string caption_pace = 7;
  optional string composition_body = 8;
}
message CreateVideoTemplateResponse { VideoTemplate template = 1; }
message UpdateVideoTemplateRequest {
  string id = 1;
  optional string name = 2;
  ClipInformationFields information_fields = 3;
  optional string cut_guidance = 4;
  ClipCopyStyles copy_styles = 5;
  optional string accent = 6;
  // Present means change it, and only one of the five is accepted.
  optional string preset = 7;
  optional string caption_pace = 8;
  optional string composition_body = 9;
}
message UpdateVideoTemplateResponse { VideoTemplate template = 1; }
message DeleteVideoTemplateRequest { string id = 1; }
message DeleteVideoTemplateResponse { int32 detached_projects = 1; }
message ListClipProjectsRequest {}
message ListClipProjectsResponse { repeated ClipProject projects = 1; }
message CreateClipProjectRequest {
  string title = 1;
  string video_template_id = 2;
  string ratio = 3;
  int32 target_duration_ms = 4;
  repeated ClipAnswer answers = 5;
  // Both may be empty at creation; generation refuses an empty disclosure.
  string disclosure = 6;
  string cta = 7;
  bool hide_disclosure = 8;
  ClipCompositionInputs composition_inputs = 9;
}
message CreateClipProjectResponse { ClipProject project = 1; }
message GetClipProjectRequest { string id = 1; }
message GetClipProjectResponse { ClipProject project = 1; }
message UpdateClipProjectRequest {
  string id = 1;
  optional string title = 2;
  optional string video_template_id = 3;
  optional int32 target_duration_ms = 4;
  // Only supplied labels change; an empty text explicitly clears that answer.
  repeated ClipAnswer answers = 5;
  optional string disclosure = 6;
  optional string cta = 7;
  optional bool hide_disclosure = 8;
  ClipCompositionInputs composition_inputs = 9;
}
message UpdateClipProjectResponse { ClipProject project = 1; }
message DeleteClipProjectRequest { string id = 1; }
message DeleteClipProjectResponse {}
// Source bytes travel directly to object storage, never in an RPC body.
message ClipSourceMetadata {
  string filename = 1;
  string content_type = 2;
  int64 bytes = 3;
  int32 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
  string fingerprint = 7;
}
message ClipSource {
  string id = 1;
  ClipSourceMetadata metadata = 2;
  string state = 3;
  int64 actual_bytes = 4;
  string retention_expires_at = 5;
  string availability = 6;
}
message ClipSourceBatch {
  string id = 1;
  string project_id = 2;
  string state = 3;
  repeated ClipSource sources = 4;
  string expires_at = 5;
  bool current = 6;
}
message ClipSourceUpload {
  string source_id = 1;
  string put_url = 2;
  map<string,string> headers = 3;
  string expires_at = 4;
}
message CreateClipSourceBatchRequest { string project_id = 1; repeated ClipSourceMetadata sources = 2; }
message CreateClipSourceBatchResponse { ClipSourceBatch batch = 1; repeated ClipSourceUpload uploads = 2; }
message ConfirmClipSourceRequest { string batch_id = 1; string source_id = 2; }
message ConfirmClipSourceResponse { ClipSourceBatch batch = 1; }
message DiscardClipSourceBatchRequest { string batch_id = 1; }
message DiscardClipSourceBatchResponse {}
message GetClipSourcesRequest { string project_id = 1; }
message GetClipSourcesResponse { repeated ClipSourceBatch batches = 1; }
message GetClipSourcePlaybackRequest { string project_id = 1; string source_id = 2; string expected_fingerprint = 3; }
message GetClipSourcePlaybackResponse { string url = 1; string expires_at = 2; }
message StartClipGenerationRequest {
  string project_id = 1;
  string batch_id = 2;
  ModelRef observe_model = 3;
  ModelRef write_model = 4;
  string quote_id = 5;
  optional int32 approved_max_credits = 6;
}
message StartClipGenerationResponse { string job_id = 1; }
message QuoteClipGenerationRequest {
  string project_id = 1;
  string batch_id = 2;
  ModelRef observe_model = 3;
  ModelRef write_model = 4;
}
message ClipPricedCall {
  ModelRef model = 1;
  string stage = 2;
  int32 calls = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;
  string reasoning = 6;
  string input_usd_per_million = 7;
  string output_usd_per_million = 8;
}
message QuoteClipGenerationResponse {
  string quote_id = 1;
  int32 max_credits = 2;
  string expires_at = 3;
  repeated ClipPricedCall priced_calls = 4;
}
message ClipCaption {
  string text = 1;
  // The caption's VERTICAL anchor: top, upper_mid, lower_mid or bottom. The
  // field keeps its number through the vocabulary change; the three former
  // values top/center/bottom no longer exist, and center became lower_mid.
  string position = 2;
  string style = 3;
  string accent = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
  // Horizontal alignment against the anchor: center, left or right. Separate
  // from the anchor because the anchor-step rule reasons over the anchor alone.
  string align = 7;
  // The one word 크게 강조 colours and 형광펜 highlights. A substring of `text`,
  // or empty for none; a field rather than a marker so `text` stays exact.
  string keyword = 8;
  // Independent of typography. Empty or steady is legacy sentence mode.
  string pace = 9;
}
message ClipEditCut {
  string id = 1;
  string source_id = 2;
  string fingerprint = 3;
  int32 start_ms = 4;
  int32 end_ms = 5;
  // The first copy, kept populated for one release so a client that has not
  // moved to `copies` still shows the sentence. `copies` is the authority.
  ClipCaption copy = 6;
  int32 volume_permille = 7;
  // Reserved fact labels whose chips belong on this cut, at most two.
  repeated string chips = 8;
  // The transition INTO this cut: 0 is a hard cut, 200 the fade a scene change
  // earns and 300 the fade-through-black nothing offers yet. The first cut of a
  // plan always carries 0.
  int32 transition_ms = 9;
  // Sentence mode carries up to two copies; rapid mode carries up to 24
  // sequential short phrases with explicit times (CDS-59).
  repeated ClipCaption copies = 10;
  ClipFocal focal = 11;
}
message ClipFocal { double x = 1; double y = 2; }
message ClipTextRow { string role = 1; string text = 2; }
message ClipEditablePhrase { string text = 1; int32 start_ms = 2; int32 end_ms = 3; }
message ClipTextEvidence { string source_id = 1; string fingerprint = 2; int32 start_ms = 3; int32 end_ms = 4; }
// IDs, kind, role and evidence ownership are read projections. Only the saved
// declaration can authorize an element; callers cannot create new identities.
message ClipEditableText {
  string instance_id = 1;
  string element_id = 2;
  string cut_id = 3;
  string kind = 4;
  string role = 5;
  string text = 6;
  repeated ClipTextRow rows = 7;
  string style = 8;
  string position = 9;
  string align = 10;
  string basis = 11;
  optional int32 start_ms = 12;
  optional int32 end_ms = 13;
  string pace = 14;
  string accent = 15;
  string keyword = 16;
  int32 resolved_start_ms = 17;
  int32 resolved_end_ms = 18;
  string group_id = 19;
  string item_id = 20;
  // Phrase times are relative to the owned cut; empty requests automatic splitting.
  repeated ClipEditablePhrase phrases = 21;
  bool stale_evidence = 22;
  // Explicit owner acknowledgement; never changes recorded observations.
  bool evidence_reviewed = 23;
  repeated ClipTextEvidence evidence = 24;
  string fallback_reason = 25;
  // Frozen automatic interval, relative to the owning cut when present.
  optional int32 effective_start_ms = 26;
  optional int32 effective_end_ms = 27;
}
message ClipEditPlan {
  int32 duration_ms = 1;
  repeated ClipEditCut cuts = 2;
  // The opening card's one sentence (CDS-28). Empty renders no hook card.
  string hook = 3;
  bool native_composition = 4;
  repeated ClipEditableText elements = 5;
  ClipSourceAssociations associations = 6;
}
message ClipSourceAssociations { repeated ClipSourceAssociation values = 1; }

message PrepareClipPreviewRequest {
  string project_id = 1;
  int32 expected_revision = 2;
  // SHA-256 of the deterministic protobuf encoding of plan.
  string draft_hash = 3;
  ClipEditPlan plan = 4;
  repeated string element_ids = 5;
  int32 asset_offset = 6;
}
enum ClipPreviewParity {
  CLIP_PREVIEW_PARITY_UNSPECIFIED = 0;
  CLIP_PREVIEW_PARITY_SOURCE_CONTRAST_FINAL_ONLY = 1;
  CLIP_PREVIEW_PARITY_AUDIO_NORMALIZATION_FINAL_ONLY = 2;
  CLIP_PREVIEW_PARITY_BROWSER_FRAME_TIMING = 3;
}
message ClipPreviewAsset {
  string key = 1;
  string instance_id = 2;
  bytes png = 3;
  int32 x = 4;
  int32 y = 5;
  int32 width = 6;
  int32 height = 7;
  int32 start_ms = 8;
  int32 end_ms = 9;
  int32 in_ms = 10;
  int32 out_ms = 11;
  double dy = 12;
  int32 layer = 13;
}
message PrepareClipPreviewResponse {
  string draft_hash = 1;
  int32 canvas_width = 2;
  int32 canvas_height = 3;
  repeated ClipPreviewAsset assets = 4;
  // -1 means this requested element page is complete.
  int32 next_offset = 5;
  repeated ClipPreviewParity parity = 6;
}
message ClipRetainedSource {
  string id = 1;
  string fingerprint = 2;
  string filename = 3;
  int32 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
}
message ClipEditingState {
  ClipEditPlan plan = 1;
  repeated ClipRetainedSource sources = 2;
  repeated string copy_styles = 3;
  // Retained for one release so a client that has not moved to each cut's own
  // `transition_ms` still reads a number. Nothing computes a duration from it.
  int32 fade_ms = 4;
  int32 max_cuts = 5;
  int32 max_copy_runes = 6;
  int32 min_duration_ms = 7;
  int32 max_duration_ms = 8;
}
message SaveClipEditPlanRequest { string project_id = 1; int32 expected_revision = 2; ClipEditPlan plan = 3; }
message SaveClipEditPlanResponse { ClipProject project = 1; }
message StartClipRenderRequest { string project_id = 1; int32 expected_revision = 2; string batch_id = 3; }
message StartClipRenderResponse { string job_id = 1; }

// Version 0 means unavailable; storage support never implies execution support.
message GetClipCapabilitiesRequest {}
message GetClipCapabilitiesResponse {
  int32 composition_version = 1;
  int32 composition_plan_version = 2;
}
message ClipCompositionItem {
  string id = 1;
  map<string, string> values = 2;
}
message ClipCompositionItems { repeated ClipCompositionItem items = 1; }
message ClipSourceAssociation {
  string group_id = 1;
  string item_id = 2;
  string source_id = 3;
  string fingerprint = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
}
// Present patches replace this whole value, including explicitly empty maps.
message ClipCompositionInputs {
  map<string, string> values = 1;
  map<string, ClipCompositionItems> items = 2;
  repeated ClipSourceAssociation associations = 3;
}
message ClipCompositionSnapshot {
  int32 version = 1;
  string body = 2;
  string template_id = 3;
  bool legacy = 4;
}
message ClipProjectComposition {
  ClipCompositionSnapshot snapshot = 1;
  ClipCompositionInputs inputs = 2;
}
