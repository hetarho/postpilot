syntax = "proto3";
package postpilot.v1;
option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

import "postpilot/v1/post.proto";
import "postpilot/v1/provider.proto";
import "postpilot/v1/language.proto";

// clip.proto holds the clip domain's SHARED messages. Its rpcs live in one file and service
// per family — clip_template, clip_source, clip_generation, clip_plan, clip_render (ARCH-41) —
// and a message may move between those files freely: `buf.yaml` breaks on PACKAGE, so only a
// wire change is a breaking change.
// Exactly one answer per model. UNSPECIFIED is a missing value, never eligible.
enum ClipAnalysisEligibility {
  CLIP_ANALYSIS_ELIGIBILITY_UNSPECIFIED = 0;
  CLIP_ANALYSIS_ELIGIBILITY_ELIGIBLE = 1;
  CLIP_ANALYSIS_ELIGIBILITY_VIDEO_INPUT_ABSENT = 2;
  CLIP_ANALYSIS_ELIGIBILITY_INLINE_ENDPOINT_UNAVAILABLE = 3;
  CLIP_ANALYSIS_ELIGIBILITY_REQUIRED_PARAMETERS_UNSUPPORTED = 4;
  CLIP_ANALYSIS_ELIGIBILITY_PRICE_CEILING_UNAVAILABLE = 5;
}
message ClipAnalysisModelEligibility {
  ModelRef model = 1;
  ClipAnalysisEligibility status = 2;
}
// Presence-aware caption style selection: absent leaves it as it is, present
// replaces it whole, and present-and-empty is a selection of none (CLIP-142).
message ClipCaptionStyles { repeated string values = 1; }
// A template is an outline body under a name (CLIP-4). The retired category-preset
// recipe and its conversion flags keep their numbers and names reserved.
message VideoTemplate {
  reserved 3 to 6, 10, 11, 13, 14;
  reserved "information_fields", "cut_guidance", "copy_styles", "accent", "preset", "caption_pace", "composition_legacy", "composition_converted";
  string id = 1;
  string name = 2;
  int32 project_count = 7;
  string created_at = 8;
  string updated_at = 9;
  string composition_body = 12;
  // The template's starting design selection (CLIP-166, CLIP-168), ClipProject's shapes (34–36):
  // a project created with the template, or switched to it, takes these three. Empty is the
  // shared default.
  string intro_preset = 15;
  string outro_preset = 16;
  repeated string allowed_caption_styles = 17;
}
enum ClipRenderKind {
  CLIP_RENDER_KIND_UNSPECIFIED = 0;
  CLIP_RENDER_KIND_SERVER = 1;
  CLIP_RENDER_KIND_BROWSER = 2;
}
message ClipResult {
  ClipRenderKind render_kind = 8;
  string id = 7;
  string content_type = 1;
  int64 bytes = 2;
  int32 duration_ms = 3;
  string created_at = 4;
  string view_url = 5;
  string download_url = 6;
}
message ClipProject {
  // The label-keyed answers to a category-preset recipe and the closing call to
  // action are retired; an outline's values travel in `composition`.
  reserved 6, 17;
  reserved "answers", "cta";
  string id = 1;
  string title = 2;
  string video_template_id = 3;
  // Exactly vertical, horizontal or square; immutable after creation.
  string ratio = 4;
  int32 target_duration_ms = 5;
  ClipResult result = 7;
  int32 edit_plan_revision = 8;
  int32 rendered_plan_revision = 9;
  string created_at = 10;
  string updated_at = 11;
  GenerationJob latest_job = 12;
  // Detail only: retained metadata and a structured correction draft, never source URLs.
  ClipEditingState editing = 13;
  ClipAccounting accounting = 14;
  // The owner's campaign type (ad | sponsored | provided | paid | self). The
  // phrases are code-owned: only these ids travel.
  string disclosure = 16;
  // Independent visibility choice; older projects/clients keep the badge shown.
  bool hide_disclosure = 18;
  // Owner-only, byte-free identity for reconciling an ambiguous start response.
  ClipAttempt latest_attempt = 15;
  // Detail only: recorded observations from the latest successful generation.
  ClipObservations observations = 19;
  ClipProjectComposition composition = 20;
  string finalized_at = 21;
  int32 finalized_plan_revision = 22;
  string finalized_result_id = 23;
  optional bool can_edit = 24;
  optional bool can_finalize = 25;
  // Empty when ready; finalized | busy | missing_render | stale_render | invalid_plan | unavailable.
  string finalization_refusal = 26;
  // Detail only, separate from canonical successful state; no media URLs.
  ClipAttemptInspection attempt_inspection = 27;
  ContentLanguage language = 28;
  // Read-only delivery notices, filtered against owner edits.
  repeated ClipNotice notices = 29;
  // The owner's own free-text instruction for this project, empty when none was
  // written. On content it outranks the template's authored guidance; the
  // declared structure stays the template's.
  string instruction = 30;
  // The owner's caption pace and accent for THIS clip (CLIP-139). Empty is the
  // shared default: the steady pace and no accent.
  string caption_pace = 31;
  string accent = 32;
  // What the owner asked the AI for, newest first (CLIP-133).
  repeated ClipProjectRequest requests = 33;
  // The project's design selection (CLIP-139, CLIP-142): the presets the intro
  // and the outro render in, and the caption styles this clip may use. The
  // project's to change; an empty style list is the default style alone.
  string intro_preset = 34;
  string outro_preset = 35;
  repeated string allowed_caption_styles = 36;
  // Absent until the project has a successful result; derived from that result.
  optional ClipRenderKind last_render_kind = 37;
  // The clip's storyline (CLIP-178); absent when it has none.
  ClipStoryline storyline = 38;
  // Whether the owner changed the plan since a writer last wrote it (CLIP-180): what
  // 이 스토리로 만들기 confirms before replacing it.
  bool plan_edited_by_hand = 39;
  ClipProjectRegions regions = 40;
  ClipDubbingOptions dubbing = 41;
}

message ClipDubbingOptions { bool enabled = 1; string voice_id = 2; }

// One paragraph of a clip's storyline: what that part of the clip shows and says, and the
// observed scenes it uses, each an observation id of the project's analysis.
message ClipStorylineParagraph {
  string text = 1;
  repeated string observation_ids = 2;
}

// A clip's storyline (CLIP-178): its paragraphs in order, whether the owner edited it by hand,
// and — computed on read — the sources added since it was written and the observed scenes of
// the sources it was written from that no paragraph holds.
message ClipStoryline {
  repeated ClipStorylineParagraph paragraphs = 1;
  bool edited_by_hand = 2;
  repeated string added_source_ids = 3;
  repeated string taken_out_observation_ids = 4;
}
// One accepted request, verbatim: the instruction a generation froze, or the
// words of a revision. An empty body under kind `instruction` is the record of a
// clip written without one. Never a diagnostic (CLIP-88), never deduplicated.
message ClipProjectRequest {
  // instruction | revision:flow | revision:narration | revision:both.
  string kind = 1;
  string body = 2;
  string created_at = 3;
}
message ClipNotice {
  string code = 1;
  string cut_id = 2;
  string element_id = 3;
  // repair | removal | shortfall; notices never block owner actions.
  string action = 4;
}
message ClipObservations {
  // available | empty | unavailable; older servers omit this message.
  string status = 1;
  repeated ClipSourceObservation sources = 2;
}
message ClipSourceObservation {
  ClipRetainedSource source = 1;
  repeated ClipObservedSegment segments = 2;
}
message ClipObservedSegment {
  int32 start_ms = 1;
  int32 end_ms = 2;
  string event = 3;
  repeated string subjects = 4;
  string speech = 5;
  string quality = 6;
  string action = 7;
  string motion = 8;
  // certain | uncertain | unknown, and usable | unusable. Both are empty in a
  // record written under clip-observation-v1; a reader labels those unspecified
  // rather than inventing a status.
  string certainty = 9;
  string usability = 10;
  // Server-projected focal/default used when adding footage from this scene.
  ClipFocal focal = 11;
}
message ClipAttempt {
  string job_id = 1;
  string batch_id = 2;
  string quote_id = 3;
}
message ClipAccounting {
  string job_id = 1;
  // not_reserved | reserved | settling | settled | exempt | unavailable
  string status = 2;
  optional int32 approved_max_credits = 3;
  optional int32 reserved_credits = 4;
  optional int32 final_charge_credits = 5;
  optional int32 refund_credits = 6;
  optional int32 shadow_charge_credits = 7;
  bool settled = 8;
  optional int32 nominal_reserved_credits = 9;
  optional int32 confirmed_charge_credits = 10;
  optional int32 cancellation_fee_credits = 11;
  string settlement_reason = 12;
  int32 cancellation_policy_version = 13;
  optional int32 shadow_confirmed_charge_credits = 14;
  optional int32 shadow_cancellation_fee_credits = 15;
  string fault_cause = 16;
  optional int32 compensation_credits = 17;
  string compensation_expires_at = 18;
  optional int32 net_debit_credits = 19;
  // The job's frozen rate stays recorded for audit, never on a customer screen (QUOTA-65).
  reserved 20;
  reserved "rate";
}
// Source bytes travel directly to object storage, never in an RPC body.
message ClipSourceMetadata {
  string filename = 1;
  string content_type = 2;
  int64 bytes = 3;
  int32 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
  string fingerprint = 7;
}
message ClipSource {
  string id = 1;
  ClipSourceMetadata metadata = 2;
  string state = 3;
  int64 actual_bytes = 4;
  string retention_expires_at = 5;
  string availability = 6;
  // The owner's 원본 소리 유지 choice for this source. Off for every new source.
  bool retain_original_audio = 7;
}
message ClipSourceBatch {
  string id = 1;
  string project_id = 2;
  string state = 3;
  repeated ClipSource sources = 4;
  string expires_at = 5;
  bool current = 6;
}
message ClipSourceUpload {
  string source_id = 1;
  string put_url = 2;
  map<string,string> headers = 3;
  string expires_at = 4;
}
message ClipPricedCall {
  ModelRef model = 1;
  string stage = 2;
  int32 calls = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;
  string reasoning = 6;
  // A quote reaches its owner, who is never shown supplier prices (QUOTA-66).
  reserved 7, 8;
  reserved "input_usd_per_million", "output_usd_per_million";
  // Which call of its stage this is: `observe`, `flow` or `narration`. A
  // generation makes two writing calls of the same stage on the same model, so
  // the label, not the stage, tells the owner which line is which.
  string label = 9;
}
// What the sequence-rendered captions of this clip add to a render (CDS-81): a
// static style is rasterised once however long it is on screen, while a
// sequence style draws one layer per output frame. Counted from the plan the
// project holds, or — before the first generation — from the selection alone,
// assuming the whole target is sequence-rendered if any selected style permits
// it. No caption ceiling applies (CLIP-145), and rendering costs no credits
// at all (CLIP-20).
message ClipSequenceCaptionCost {
  // Whether the captions were counted from a plan the project actually holds.
  bool from_plan = 1;
  // The plan's sequence captions (zero before narration), their frames or
  // the whole target's frames, and the measured added render time.
  int32 captions = 2;
  int32 frames = 3;
  int32 added_render_ms = 4;
  // Sequence-rendered styles in the project's own selection (CLIP-142).
  int32 selected_styles = 5;
}
message ClipCancellationPolicy {
  int32 version = 1;
  int32 unused_reservation_numerator = 2;
  int32 unused_reservation_denominator = 3;
  string rounding = 4;
  int32 service_fault_compensation_numerator = 5;
  int32 service_fault_compensation_denominator = 6;
  int32 service_fault_compensation_valid_days = 7;
}
message ClipCaption {
  string text = 1;
  // The caption's VERTICAL anchor: top, upper_mid, lower_mid or bottom. The
  // field keeps its number through the vocabulary change; the three former
  // values top/center/bottom no longer exist, and center became lower_mid.
  string position = 2;
  string style = 3;
  string accent = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
  // Horizontal alignment against the anchor: center, left or right. Separate
  // from the anchor because the anchor-step rule reasons over the anchor alone.
  string align = 7;
  // The one word 크게 강조 colours and 형광펜 highlights. A substring of `text`,
  // or empty for none; a field rather than a marker so `text` stays exact.
  string keyword = 8;
  // Independent of typography. Empty or steady is legacy sentence mode.
  string pace = 9;
}
message ClipEditCut {
  // Fact chips are retired (CLIP-68).
  reserved 8;
  reserved "chips";
  string id = 1;
  string source_id = 2;
  string fingerprint = 3;
  int32 start_ms = 4;
  int32 end_ms = 5;
  // The first copy, kept populated for one release so a client that has not
  // moved to `copies` still shows the sentence. `copies` is the authority.
  ClipCaption copy = 6;
  int32 volume_permille = 7;
  // The transition INTO this cut: 0 is a hard cut, 200 the fade a scene change
  // earns and 300 the fade-through-black nothing offers yet. The first cut of a
  // plan always carries 0.
  int32 transition_ms = 9;
  // Sentence mode carries up to two copies; rapid mode carries up to 24
  // sequential short phrases with explicit times (CDS-59).
  repeated ClipCaption copies = 10;
  ClipFocal focal = 11;
  // The ONE constant rate this cut plays at, as permille: 500, 750, 1000, 1250,
  // 1500 or 2000 and nothing else. ABSENT is a client that predates rates and
  // is read as 1x; an explicit 0 is not a rate and is refused.
  optional int32 playback_rate_permille = 12;
  // Request-only, one-time provenance for a cut the owner is adding. It is
  // never stored and never returned: an id the server already knows rejects it.
  ClipCutCreation creation = 13;
}
// `kind` is add or split and nothing else. Both need an origin cut, because a
// new cut inherits its place in the template from one the server already
// approved rather than from anything the client asserts.
message ClipCutCreation {
  string kind = 1;
  string origin_cut_id = 2;
}
// One source's owner-controlled original-sound retention. Source audio is off
// by default and no template, model or render may turn it on.
message ClipSourceAudioSetting {
  string source_id = 1;
  string fingerprint = 2;
  bool retain_original_audio = 3;
}
// The complete snapshot for every source the plan's cuts draw on. The wrapper
// exists so an ABSENT value (a plan written before the setting) stays different
// from a present snapshot in which every source is off.
message ClipSourceAudioSettings { repeated ClipSourceAudioSetting values = 1; }
message ClipFocal { double x = 1; double y = 2; }
message ClipTextRow { string role = 1; string text = 2; }
message ClipEditablePhrase { string text = 1; int32 start_ms = 2; int32 end_ms = 3; }
message ClipTextEvidence { string source_id = 1; string fingerprint = 2; int32 start_ms = 3; int32 end_ms = 4; }
// IDs, kind, role and evidence ownership are read projections. Only the saved
// declaration can authorize an element; callers cannot create new identities.
message ClipEditableText {
  string instance_id = 1;
  string element_id = 2;
  string cut_id = 3;
  string kind = 4;
  string role = 5;
  string text = 6;
  repeated ClipTextRow rows = 7;
  string style = 8;
  string position = 9;
  string align = 10;
  string basis = 11;
  optional int32 start_ms = 12;
  optional int32 end_ms = 13;
  string pace = 14;
  string accent = 15;
  string keyword = 16;
  int32 resolved_start_ms = 17;
  int32 resolved_end_ms = 18;
  string group_id = 19;
  string item_id = 20;
  // Phrase times are relative to the owned cut, and absolute on the output
  // timeline for a caption that owns no cut — narration among them.
  repeated ClipEditablePhrase phrases = 21;
  bool stale_evidence = 22;
  // Explicit owner acknowledgement; never changes recorded observations.
  bool evidence_reviewed = 23;
  repeated ClipTextEvidence evidence = 24;
  string fallback_reason = 25;
  // Frozen automatic interval, relative to the owning cut when present.
  optional int32 effective_start_ms = 26;
  optional int32 effective_end_ms = 27;
  // Whether this caption is narration: it belongs to no cut, is declared by no
  // template, and its start/end are absolute times on the output timeline. A
  // read projection, carried back unchanged; only `creation` makes a new one.
  bool narration = 28;
  // Request-only, one-time provenance for a caption the owner is adding. It is
  // never stored and never returned, and the server mints the identity: a
  // caption is created exactly once, and never by a client's own id.
  ClipTextCreation creation = 29;
  // What the owner set for this caption in ②, each part absent on its own: the
  // top-left of its measured bounds on the ratio's canvas, the font size of its
  // role in px, and a style id from the project's allowed set. Absent means
  // automatic placement, the style's own size and the project's default style.
  ClipCaptionPlacement owner_position = 30;
  int32 owner_size_px = 31;
  string owner_style = 32;
  // Read projection of the stored caption authorship. The server decides it
  // from the saved plan and ignores this value when accepting a correction.
  bool owner_edited = 33;
  ClipDerivedCaption derived_caption = 34;
}
// An absolute caption position in whole canvas pixels, never a fraction: the
// layout resolves everything to canvas pixels and the preview places the served
// fragment with the same numbers the render does.
message ClipCaptionPlacement {
  int32 x = 1;
  int32 y = 2;
}
// `kind` is add and nothing else, and narration is the only caption an owner
// may add — every other one is a template declaration.
message ClipTextCreation { string kind = 1; }
message ClipEditPlan {
  // The legacy opening sentence is retired: an intro is an outline entry.
  reserved 3;
  reserved "hook";
  int32 duration_ms = 1;
  repeated ClipEditCut cuts = 2;
  bool native_composition = 4;
  repeated ClipEditableText elements = 5;
  ClipSourceAssociations associations = 6;
  // A read projection: the owner changes it through its own action, never by
  // saving a plan. A draft may return it unchanged; anything else is refused.
  ClipSourceAudioSettings source_audio = 7;
  ClipNarration narration = 8;
  optional int32 source_volume_permille = 9;
}
message ClipSourceAssociations { repeated ClipSourceAssociation values = 1; }

// A box in canvas pixels, carried as doubles because a measured caption box is
// not integral: the preview places the fragment at exactly the numbers the
// render uses, and rounding here would show the owner a different placement.
message ClipCanvasBox {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}
message ClipCaptionFragment {
  string instance_id = 1;
  // A `<g>` holding the caption drawn at the ORIGIN, with the `<defs>` its
  // filters need and every id prefixed with this caption's own instance. The
  // caller places it with one transform, so moving a caption needs no round
  // trip; two captions on screen cannot collide on a filter id.
  string svg = 2;
  // Where the caption's measured bounds sit on the canvas today.
  ClipCanvasBox box = 3;
  double font_size = 4;
  string style = 5;
  // A sequence-rendered style draws one layer per output frame; this fragment
  // is ONE representative frame of that motion, not the motion itself.
  bool representative_frame = 6;
}

enum ClipPreviewParity {
  CLIP_PREVIEW_PARITY_UNSPECIFIED = 0;
  CLIP_PREVIEW_PARITY_SOURCE_CONTRAST_FINAL_ONLY = 1;
  CLIP_PREVIEW_PARITY_AUDIO_NORMALIZATION_FINAL_ONLY = 2;
  CLIP_PREVIEW_PARITY_BROWSER_FRAME_TIMING = 3;
}
message ClipPreviewAsset {
  string key = 1;
  string instance_id = 2;
  bytes png = 3;
  int32 x = 4;
  int32 y = 5;
  int32 width = 6;
  int32 height = 7;
  int32 start_ms = 8;
  int32 end_ms = 9;
  int32 in_ms = 10;
  int32 out_ms = 11;
  double dy = 12;
  int32 layer = 13;
  // One representative raster of a sequence style; its motion is applied per frame.
  bool representative_frame = 14;
  // A line of this element still reads under 4.5:1 on its sampled ground, after
  // any scrim (CDS-44). Only a render-bound asset has a sampled ground.
  bool contrast_notice = 15;
}
message ClipRetainedSource {
  string id = 1;
  string fingerprint = 2;
  string filename = 3;
  int32 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
  // The rates this source may actually be cut at, computed by the server from
  // its verified original cadence. A slow rate is absent when the source cannot
  // reach the output cadence without invented frames.
  repeated int32 allowed_rate_permille = 7;
}
message ClipEditingState {
  reserved 3;
  reserved "copy_styles";
  ClipEditPlan plan = 1;
  repeated ClipRetainedSource sources = 2;
  // Retained for one release so a client that has not moved to each cut's own
  // `transition_ms` still reads a number. Nothing computes a duration from it.
  int32 fade_ms = 4;
  int32 max_cuts = 5;
  int32 max_copy_runes = 6;
  int32 min_duration_ms = 7;
  int32 max_duration_ms = 8;
}
message ClipRenderMeasurements {
  int32 width = 1;
  int32 height = 2;
  int32 frame_rate_numerator = 3;
  int32 frame_rate_denominator = 4;
  int32 video_frames = 5;
  string video_codec = 6;
  string video_profile = 7;
  bool has_audio = 8;
  string audio_codec = 9;
  int32 audio_rate = 10;
  optional double loudness_lufs = 11;
  bool silent = 12;
  // Fingerprint of the immutable speech actually decoded and mixed by this producer.
  string speech_fingerprint = 13;
  optional double true_peak_dbtp = 14;
}

message ClipCompositionItem {
  string id = 1;
  map<string, string> values = 2;
}
message ClipCompositionItems { repeated ClipCompositionItem items = 1; }
message ClipSourceAssociation {
  string group_id = 1;
  string item_id = 2;
  string source_id = 3;
  string fingerprint = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
}
// Present patches replace this whole value, including explicitly empty maps.
message ClipCompositionInputs {
  map<string, string> values = 1;
  map<string, ClipCompositionItems> items = 2;
  repeated ClipSourceAssociation associations = 3;
}
message ClipCompositionSnapshot {
  // Snapshots synthesized from a category-preset recipe are retired.
  reserved 4;
  reserved "legacy";
  int32 version = 1;
  string body = 2;
  string template_id = 3;
}
message ClipProjectComposition {
  ClipCompositionSnapshot snapshot = 1;
  ClipCompositionInputs inputs = 2;
}

message ClipAttemptInspection {
  string job_id = 1;
  // available | missing | unavailable
  string status = 2;
  string stage = 3;
  int32 completed_chunks = 4;
  int32 total_chunks = 5;
  int32 completed_sources = 6;
  int32 total_sources = 7;
  ClipObservations observations = 8;
  repeated ClipAttemptRange ranges = 9;
  string validation_check = 10;
  string validation_phase = 11;
  map<string, int32> measurements = 12;
  bool evidence_limited = 13;
}
message ClipAttemptRange {
  int32 cut = 1;
  int32 source = 2;
  int32 start_ms = 3;
  int32 end_ms = 4;
  bool valid = 5;
}

// Project-owned region slots; empty final text is distinct from an unedited draft.
message ClipRegionSlot {
  string id = 1;
  string instruction = 2;
  string text = 3;
  bool instruction_edited = 4;
  bool owner_fixed = 5;
  bool bound = 6;
}
message ClipProjectRegion {
  bool enabled = 1;
  repeated ClipRegionSlot slots = 2;
}
message ClipProjectRegions {
  int32 revision = 1;
  ClipProjectRegion intro = 2;
  ClipProjectRegion outro = 3;
}
message ClipRegionSlotEdit {
  string id = 1;
  optional string instruction = 2;
  optional string text = 3;
}
message ClipRegionEdit {
  optional bool enabled = 1;
  repeated ClipRegionSlotEdit slots = 2;
}

// Spoken script is independent of displayed caption text. All speech provenance
// is server-owned; correction requests may carry the projection unchanged.
message ClipNarration {
  bool enabled = 1;
  string confirmed_voice_id = 2;
  optional int32 volume_permille = 3;
  repeated ClipSpokenSegment segments = 4;
  string binding_digest = 5;
}
message ClipSpokenSegment {
  string id = 1;
  string text = 2;
  int32 text_revision = 3;
  string input_hash = 4;
  int32 start_ms = 5;
  int32 end_ms = 6;
  ClipSpeechRef speech = 7;
  bool creation = 8;
}
message ClipSpeechRef {
  string asset_id = 1;
  string voice_id = 2;
  string binding_digest = 3;
  string input_hash = 4;
  string settings_hash = 5;
  string audio_hash = 6;
  string profile_id = 7;
  int64 profile_revision = 8;
  int64 samples = 9;
  int32 sample_rate = 10;
  int32 channels = 11;
  repeated ClipSpeechTiming timing = 12;
}
message ClipSpeechTiming { string text = 1; int32 start_ms = 2; int32 end_ms = 3; }
message ClipDerivedCaption {
  string segment_id = 1;
  int32 text_revision = 2;
  bool text_edited = 3;
  bool timing_edited = 4;
}
