syntax = "proto3";

package postpilot.v1;

import "postpilot/v1/error.proto";
import "postpilot/v1/provider.proto";

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

// Every procedure is scoped by the authenticated context. No request carries a user id.
service VoiceService {
  // The voice directory: an account has zero or more voices and at most one active, made
  // default.
  rpc ListVoices(ListVoicesRequest) returns (ListVoicesResponse) {}
  rpc CreateVoice(CreateVoiceRequest) returns (CreateVoiceResponse) {}
  rpc RenameVoice(RenameVoiceRequest) returns (RenameVoiceResponse) {}
  rpc SetDefaultVoice(SetDefaultVoiceRequest) returns (SetDefaultVoiceResponse) {}
  rpc DeleteVoice(DeleteVoiceRequest) returns (DeleteVoiceResponse) {}
  rpc RestoreVoice(RestoreVoiceRequest) returns (RestoreVoiceResponse) {}

  rpc GetVoiceProfile(GetVoiceProfileRequest) returns (GetVoiceProfileResponse) {}
  // 학습 글 (VOICE-59): a pasted post, or an answer to one of the shared prompts. Gathering
  // calls no model and enqueues nothing (VOICE-16).
  rpc AddVoiceSample(AddVoiceSampleRequest) returns (AddVoiceSampleResponse) {}
  rpc UpdateVoiceSample(UpdateVoiceSampleRequest) returns (UpdateVoiceSampleResponse) {}
  rpc DeleteVoiceSample(DeleteVoiceSampleRequest) returns (DeleteVoiceSampleResponse) {}
  rpc GetVoiceSample(GetVoiceSampleRequest) returns (GetVoiceSampleResponse) {}
  rpc ListVoicePrompts(ListVoicePromptsRequest) returns (ListVoicePromptsResponse) {}
  rpc CreateVoicePhotoUpload(CreateVoicePhotoUploadRequest) returns (CreateVoicePhotoUploadResponse) {}
  rpc AnswerVoicePrompt(AnswerVoicePromptRequest) returns (AnswerVoicePromptResponse) {}
  // 말투 만들기 and 다시 분석: one analyze_voice job at 100% (VOICE-23).
  rpc AnalyzeVoice(AnalyzeVoiceRequest) returns (AnalyzeVoiceResponse) {}
  // 이전 분석으로 되돌리기: the previous analysis becomes current, the replaced one is discarded,
  // and there is no redo (VOICE-30).
  rpc RestorePreviousVoiceAnalysis(RestorePreviousVoiceAnalysisRequest) returns (RestorePreviousVoiceAnalysisResponse) {}
  // ②'s reading of a post against its voice (POST-102): counted from the post's blocks per
  // request, never stored, with no model call (VOICE-62).
  rpc GetPostFingerprint(GetPostFingerprintRequest) returns (GetPostFingerprintResponse) {}
  // 검증 (VOICE-43): one check_voice job on the write selection writes one answered prompt in
  // the voice, the answer withheld; results stay listed newest first, and a retry is a new job.
  rpc StartVoiceCheck(StartVoiceCheckRequest) returns (StartVoiceCheckResponse) {}
  rpc ListVoiceChecks(ListVoiceChecksRequest) returns (ListVoiceChecksResponse) {}
  rpc RetryVoiceCheck(RetryVoiceCheckRequest) returns (RetryVoiceCheckResponse) {}
}

// The sentence an item is shown with, and the 학습 글 it came from ("" for a measured text).
message VoiceExample {
  string sentence = 1;
  string material_id = 2;
}

// The fingerprint's eight counted items (VOICE-24), each in its own unit. Shares are 0…1, rates
// are per 100 sentences, and an item below its threshold is unknown rather than 0 (VOICE-26).
message VoiceSuffix {
  string text = 1;
  int32 count = 2;
}
message VoiceEndingsItem {
  bool unknown = 1;
  double da = 2;
  double haeyo = 3;
  double seumnida = 4;
  double other = 5;
  repeated VoiceSuffix suffixes = 6;
  VoiceExample example = 7;
}
message VoiceMarksItem {
  bool unknown = 1;
  double exclaim = 2;
  double question = 3;
  double tilde = 4;
  double ellipsis = 5;
  double period = 6;
  double none = 7;
  double repeat = 8;
  VoiceExample example = 9;
}
message VoiceEmojiItem {
  bool unknown = 1;
  double emoji = 2;
  double hh = 3;
  double kk = 4;
  double tears = 5;
  VoiceExample example = 6;
}
message VoiceShapeItem {
  bool unknown = 1;
  double average_chars = 2;
  double paragraph_average = 3;
  int32 paragraph_min = 4;
  int32 paragraph_max = 5;
  double line_break_share = 6;
  bool own_line = 7;
  VoiceExample example = 8;
}
message VoiceOpeningsItem {
  bool unknown = 1;
  repeated string openings = 2;
  repeated string closings = 3;
  VoiceExample example = 4;
}
message VoiceWordRate {
  string word = 1;
  double per_hundred = 2;
}
message VoiceAdverbsItem {
  bool unknown = 1;
  // A real answer: no lexicon word repeats (from 30 sentences up).
  bool none = 2;
  repeated VoiceWordRate words = 3;
  VoiceExample example = 4;
}
message VoicePersonItem {
  bool unknown = 1;
  double jeo = 2;
  double uri = 3;
  double na = 4;
  // 저, 우리 or 나; empty when no form reaches 1 per 100 sentences.
  string dominant = 5;
  VoiceExample example = 6;
}
message VoiceHeadingsItem {
  bool unknown = 1;
  int32 count = 2;
  double emoji_share = 3;
  double question_share = 4;
  double numbered_share = 5;
  double list_share = 6;
  string marker = 7;
  VoiceExample example = 8;
}
message VoiceFingerprint {
  int32 sentences = 1;
  VoiceEndingsItem endings = 2;
  VoiceMarksItem marks = 3;
  VoiceEmojiItem emoji = 4;
  VoiceShapeItem shape = 5;
  VoiceOpeningsItem openings = 6;
  VoiceAdverbsItem adverbs = 7;
  VoicePersonItem person = 8;
  VoiceHeadingsItem headings = 9;
}

// What the analysis call wrote: only what cannot be counted (VOICE-24).
message VoiceTic {
  string phrase = 1;
  string when = 2;
}
enum VoiceAiField {
  VOICE_AI_FIELD_UNSPECIFIED = 0;
  VOICE_AI_FIELD_IMPRESSION = 1;
  VOICE_AI_FIELD_TICS = 2;
  VOICE_AI_FIELD_SIGNATURE_PHRASES = 3;
}
message VoiceAiExample {
  VoiceAiField field = 1;
  string sentence = 2;
  string material_id = 3;
}
message VoiceAiPart {
  string impression = 1;
  repeated VoiceTic tics = 2;
  repeated string signature_phrases = 3;
  repeated VoiceAiExample examples = 4;
}

// One analysis (VOICE-26): the counted fingerprint, the AI part, how many 학습 글 it read, the
// model and when.
enum VoiceOrigin {
  VOICE_ORIGIN_UNSPECIFIED = 0;
  VOICE_ORIGIN_PERSONAL = 1;
  VOICE_ORIGIN_SYNTHETIC = 2;
}

message VoiceAnalysis {
  VoiceFingerprint counted = 1;
  VoiceAiPart ai = 2;
  int32 material_count = 3;
  string analyze_model = 4;
  string created_at = 5;
  // Missing origin is personal for existing saved snapshots.
  VoiceOrigin origin = 6;
  // AI-created fictional illustration, never a personal learning material.
  string synthetic_sample = 7;
  repeated VoiceAcceptedSource accepted_sources = 8;
  // False for legacy analyses: never infer an accepted snapshot from current material.
  bool source_versions_known = 9;
}

// How the 학습 글 moved since the current analysis read them (VOICE-21).
enum VoiceNoticeKind {
  VOICE_NOTICE_KIND_UNSPECIFIED = 0;
  // `새 학습 글 N편 · 다시 분석`
  VOICE_NOTICE_KIND_ADDED = 1;
  // `학습 글이 바뀌었어요 · 다시 분석`
  VOICE_NOTICE_KIND_CHANGED = 2;
}
message VoiceNotice {
  VoiceNoticeKind kind = 1;
  int32 count = 2;
}

// Where in a post a prompt's answer belongs; the readiness meter needs each (VOICE-32).
enum VoicePromptPart {
  VOICE_PROMPT_PART_UNSPECIFIED = 0;
  VOICE_PROMPT_PART_OPENING = 1;
  VOICE_PROMPT_PART_DESCRIPTION = 2;
  VOICE_PROMPT_PART_CLOSING = 3;
}

// How far the 학습 글 are from 말투 만들기 (VOICE-32): the sentence share, held below 100 while a
// part is missing, which the meter names.
message VoiceReadiness {
  int32 percent = 1;
  int32 sentences = 2;
  int32 needed = 3;
  repeated VoicePromptPart missing_parts = 4;
  int32 answered_questions = 5;
  int32 required_questions = 6;
}

message VoiceProfile {
  // The owning voice travels with the profile so a cache entry and a deleted-state screen
  // can never become detached from the voice they describe.
  Voice voice = 10;
  // Whether an analysis is published (VOICE-25), and the meter over every 학습 글.
  bool made = 12;
  VoiceReadiness readiness = 13;
  // The current analysis, unset until made; whether a previous one exists to return to; and
  // the notice when the 학습 글 moved since it read them.
  VoiceAnalysis analysis = 14;
  bool has_previous = 15;
  VoiceNotice notice = 16;
  // 1, 2, 7 were the free-text styleguide and rules; 3 and 6 the versioned structured profile,
  // retired in T471 (VOICE-6). Reserved, never reused.
  reserved 1, 2, 3, 6, 7;
  reserved "updated_at", "structured";
  repeated VoiceSample samples = 4;
  string active_job_id = 5;
  // 8 and 9 were the finalized-post source count and whether profile validation could run,
  // retired in T465; 11 was the failure of the description seed, retired in T468.
  reserved 8, 9, 11;
  reserved "finalized_source_count", "can_validate", "seed_failure";
}

enum VoiceSampleKind {
  VOICE_SAMPLE_KIND_UNSPECIFIED = 0;
  // A post the owner wrote by hand and pasted.
  VOICE_SAMPLE_KIND_POST = 1;
  // An answer to one of the shared prompts.
  VOICE_SAMPLE_KIND_ANSWER = 2;
}

// One 학습 글 as the list shows it: a post by its label, an answer by its prompt.
message VoiceSample {
  string id = 1;
  // Empty for an answer, whose prompt text is product copy.
  string label = 2;
  int32 chars = 3;
  string created_at = 4;
  VoiceSampleKind kind = 5;
  string prompt_key = 6;
  bool has_photo = 7;
  int64 content_revision = 8;
}

// One of the shared prompts every voice answers (VOICE-60). Its text is product copy, Korean in
// both locales (LANG-14).
message VoicePrompt {
  string key = 1;
  VoicePromptPart part = 2;
  bool photo = 3;
  string text = 4;
  string scene = 5;
  string hint = 6;
  bool starter = 7;
}

// A voice as the directory talks about it. `deleted` is a tombstone: the voice keeps its
// profile and its posts and stays readable, but cannot start or receive AI work.
message Voice {
  string id = 1;
  string name = 2;
  bool is_default = 3;
  bool deleted = 4;
  string created_at = 5;
  string updated_at = 6;
  string deleted_at = 7;
  // A voice carries no language: it is Korean (VOICE-10).
  reserved 8;
  reserved "source_language";
  // Whether the voice has a published analysis. Only a made voice can be assigned to a post
  // or write one; the picker lists one not yet made disabled (POST-101).
  bool made = 9;
  // The directory row's meta line (VOICE-52): how many 학습 글 the voice holds and when its
  // current analysis was published, empty until it is made.
  int32 material_count = 10;
  string analyzed_at = 11;
  // The readiness meter's share until the voice is made (VOICE-9); 0 once it is.
  int32 readiness_percent = 12;
  VoiceOrigin origin = 13;
}

message ListVoicesRequest {}
message ListVoicesResponse { repeated Voice voices = 1; }
// A voice is created by name alone, as a Korean voice not yet made (VOICE-10). 2-4 were its
// language and the description seed, retired in T468.
message CreateVoiceRequest {
  string name = 1;
  reserved 2, 3, 4;
  reserved "source_language", "description", "analyze_model";
}
message CreateVoiceResponse {
  Voice voice = 1;
  // 2 was the description seed's job.
  reserved 2;
  reserved "job_id";
}
message RenameVoiceRequest { string voice_id = 1; string name = 2; }
message RenameVoiceResponse { Voice voice = 1; }
// An empty voice_id clears the 기본 so the account has none (VOICE-12).
message SetDefaultVoiceRequest { string voice_id = 1; }
message SetDefaultVoiceResponse { repeated Voice voices = 1; }
message DeleteVoiceRequest { string voice_id = 1; }
message DeleteVoiceResponse { Voice voice = 1; }
message RestoreVoiceRequest { string voice_id = 1; }
message RestoreVoiceResponse { Voice voice = 1; }

message GetVoiceProfileRequest { string voice_id = 1; }
message GetVoiceProfileResponse { VoiceProfile profile = 1; }

// A pasted post: at least 200 trimmed characters, an empty label falling back to its first 20
// (VOICE-20). 3 was the analyze model and 2 of the response the analysis it enqueued; adding a
// 학습 글 enqueues nothing (VOICE-21).
message AddVoiceSampleRequest {
  string voice_id = 4;
  string label = 1;
  string body = 2;
  reserved 3;
  reserved "model";
}
message AddVoiceSampleResponse {
  VoiceSample sample = 1;
  reserved 2;
  reserved "job_id";
}

message DeleteVoiceSampleRequest { string voice_id = 2; string sample_id = 1; }
message DeleteVoiceSampleResponse {
  reserved 1;
  reserved "job_id";
}

// One 학습 글 opened for its owner: the full text and, for a photo answer, a view URL minted on
// this read (VOICE-8).
message GetVoiceSampleRequest { string voice_id = 1; string sample_id = 2; }
message GetVoiceSampleResponse {
  VoiceSample sample = 1;
  string body = 2;
  string photo_url = 3;
  int32 photo_width = 4;
  int32 photo_height = 5;
}

message ListVoicePromptsRequest {}
message ListVoicePromptsResponse { repeated VoicePrompt prompts = 1; }

// A photo prompt's photo is the owner's own, converted in the browser and PUT directly to
// private storage as a post photo is (VOICE-60, POST-34).
message CreateVoicePhotoUploadRequest { string voice_id = 1; string prompt_key = 2; }
message CreateVoicePhotoUploadResponse {
  string upload_id = 1;
  string put_url = 2;
  string content_type = 3;
  string expires_at = 4;
}

// A trimmed, non-empty answer; a photo prompt names the upload it was written on, with the
// dimensions the browser measured.
message AnswerVoicePromptRequest {
  string voice_id = 1;
  string prompt_key = 2;
  string body = 3;
  string upload_id = 4;
  int32 photo_width = 5;
  int32 photo_height = 6;
}
message AnswerVoicePromptResponse { VoiceSample sample = 1; }

// The model is named explicitly, like every start RPC (MODEL-23).
message AnalyzeVoiceRequest { string voice_id = 1; ModelRef model = 2; }
message AnalyzeVoiceResponse { string job_id = 1; }

message RestorePreviousVoiceAnalysisRequest { string voice_id = 1; }
message RestorePreviousVoiceAnalysisResponse { VoiceProfile profile = 1; }

// The fingerprint comparison (VOICE-62), shared by ②, 검증 and 말투 반영 비교.
enum FingerprintItem {
  FINGERPRINT_ITEM_UNSPECIFIED = 0;
  FINGERPRINT_ITEM_ENDINGS = 1;
  FINGERPRINT_ITEM_MARKS = 2;
  FINGERPRINT_ITEM_EMOJI = 3;
  FINGERPRINT_ITEM_SHAPE = 4;
  FINGERPRINT_ITEM_OPENINGS = 5;
  FINGERPRINT_ITEM_ADVERBS = 6;
  FINGERPRINT_ITEM_PERSON = 7;
  FINGERPRINT_ITEM_HEADINGS = 8;
}

// How a facet's two values read: a 0…1 share, a rate per 100 sentences, characters, sentences,
// or a list of terms.
enum FingerprintFacetUnit {
  FINGERPRINT_FACET_UNIT_UNSPECIFIED = 0;
  FINGERPRINT_FACET_UNIT_SHARE = 1;
  FINGERPRINT_FACET_UNIT_PER_HUNDRED = 2;
  FINGERPRINT_FACET_UNIT_CHARS = 3;
  FINGERPRINT_FACET_UNIT_SENTENCES = 4;
  FINGERPRINT_FACET_UNIT_TEXT = 5;
}

message FingerprintTerms { repeated string terms = 1; }

// One side's value: a number, or for a text facet its terms (possibly none).
message FingerprintFacetValue {
  oneof value {
    double number = 1;
    FingerprintTerms terms = 2;
  }
}

message FingerprintFacet {
  // The item's own facet key (`exclaim`, `해요`, an adverb itself); the widget words it.
  string key = 1;
  FingerprintFacetUnit unit = 2;
  FingerprintFacetValue voice = 3;
  FingerprintFacetValue text = 4;
}

// One counted item on the voice and on the text; an unknown item has a distance of 0.
message FingerprintItemComparison {
  FingerprintItem item = 1;
  bool unknown = 2;
  // 0…1, relative to the voice's own value.
  double distance = 3;
  // The key of the facet with the largest gap.
  string headline = 4;
  repeated FingerprintFacet facets = 5;
}

message GetPostFingerprintRequest { string post_slug = 1; }
// Items come farthest from the voice first and unknown last. applicable is false, with no
// items, for a post with 말투 없음, with no content, or whose voice is deleted or not made.
message GetPostFingerprintResponse {
  bool applicable = 1;
  // The content revision that was counted.
  int64 revision = 2;
  repeated FingerprintItemComparison items = 3;
}

enum VoiceCheckStatus {
  VOICE_CHECK_STATUS_UNSPECIFIED = 0;
  VOICE_CHECK_STATUS_QUEUED = 1;
  VOICE_CHECK_STATUS_RUNNING = 2;
  VOICE_CHECK_STATUS_DONE = 3;
  VOICE_CHECK_STATUS_FAILED = 4;
}

// One 검증 as the tab reads it: the prompt, the owner's answer beside the piece, the piece
// measured against the current analysis, and whether it was written from an older analysis.
message VoiceCheck {
  string id = 1;
  VoicePrompt prompt = 2;
  // The answer's current text; answer_deleted once that 학습 글 is gone.
  string answer = 3;
  bool answer_deleted = 4;
  VoiceCheckStatus status = 5;
  // The piece once done; the failure once failed (an interrupted job reads JOB_INTERRUPTED).
  string piece = 6;
  Failure failure = 7;
  repeated FingerprintItemComparison comparison = 8;
  // Written from an analysis the voice has since replaced (이전 분석으로 검증).
  bool stale = 9;
  ModelRef write_model = 10;
  string created_at = 11;
}

message StartVoiceCheckRequest {
  string voice_id = 1;
  string prompt_key = 2;
  ModelRef model = 3;
}
message StartVoiceCheckResponse {
  VoiceCheck check = 1;
  string job_id = 2;
}
message ListVoiceChecksRequest { string voice_id = 1; }
message ListVoiceChecksResponse {
  repeated VoiceCheck checks = 1;
  // The voice's queued or running 검증 job, so a reload resumes polling (VOICE-31).
  string active_job_id = 2;
}
message RetryVoiceCheckRequest {
  string check_id = 1;
  ModelRef model = 2;
}
message RetryVoiceCheckResponse {
  VoiceCheck check = 1;
  string job_id = 2;
}

message VoiceAcceptedSource {
  string sample_id = 1;
  int64 content_revision = 2;
}
// Presence means an edit, including an explicit empty label. Kind and prompt key cannot change.
message UpdateVoiceSampleRequest {
  string voice_id = 1;
  string sample_id = 2;
  int64 expected_content_revision = 3;
  string operation_key = 4;
  optional string label = 5;
  optional string body = 6;
  optional string photo_upload_id = 7;
  optional int32 photo_width = 8;
  optional int32 photo_height = 9;
}
message UpdateVoiceSampleResponse { VoiceSample sample = 1; }
