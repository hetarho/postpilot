syntax = "proto3";

package postpilot.v1;

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

import "postpilot/v1/language.proto";
import "postpilot/v1/provider.proto";

// template.proto is the 템플릿 slice: reusable account-owned documents that decide the SHAPE
// of a post — its sections, its literal text, the positions it reserves, and what repeats per
// photo. The voice decides how sentences sound and a guideline decides what to avoid; a
// template decides the skeleton.
//
// A template is authored text. Nothing here is learned or inferred, and a model writes one only
// when its owner asks: StartTemplateRequest is the one procedure that enqueues work or calls a
// provider (TMPL-16, TMPL-58).
//
// Every procedure is scoped to the acting user from the session — no request carries a
// user id, because a user id in a message is a claim by the caller, not a fact.
service TemplateService {
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {}
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse) {}
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse) {}
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse) {}
  // The 형식 안내 an owner copies for an outside AI (TMPL-41). The backend owns it so the copy
  // and every prompt that teaches the grammar state one text per language.
  rpc GetFormatGuide(GetFormatGuideRequest) returns (GetFormatGuideResponse) {}
  // The template request (TMPL-58): the 글 작성 모델 writes the draft's name, description, title
  // area and body from what the owner asked. It runs as a job polled through GetGeneration; its
  // answer is read once the job is done.
  rpc StartTemplateRequest(StartTemplateRequestRequest) returns (StartTemplateRequestResponse) {}
  rpc GetTemplateRequestResult(GetTemplateRequestResultRequest) returns (GetTemplateRequestResultResponse) {}
  // What one request on a write model is expected to cost, shown before it is pressed (QUOTA-67).
  rpc EstimateTemplateRequest(EstimateTemplateRequestRequest) returns (EstimateTemplateRequestResponse) {}
}

message Template {
  string id = 1;
  string name = 2;
  // What posts of this kind are for. May be empty; it is management copy and never reaches
  // a prompt.
  string description = 3;
  // The template body in the grammar of TMPL-17..TMPL-20. This string is
  // the single source of truth (TMPL-2): the builder parses and re-serializes it byte-for-byte, and
  // the write/revise prompts receive it after repeat expansion.
  string body = 4;
  // Posts currently referencing it. Shown before a delete, which detaches rather than
  // cascading — it is a projection, so it is never accepted on a write.
  int32 post_count = 5;
  string created_at = 6;
  string updated_at = 7;
  // What the posts this template shapes usually want (TMPL-47). Both are unset when the
  // template has no opinion about them, and both are SEEDS: assigning the template copies a
  // set one onto the post's own option, and nothing here ever reaches a prompt — a run keeps
  // freezing the post's values.
  optional int32 target_length = 8;
  optional int32 tag_count = 9;
  // The optional title area (TMPL-50), in the body's grammar but admitting literal text,
  // `<write>` and `<ask>` only. '' leaves the title to the model.
  string title_area = 10;
}

// The template a post is written from, as the post screens need it. Transport-only, and
// unset when the post has none: 없음 is a real answer, not a missing one.
message TemplateRef {
  string id = 1;
  string name = 2;
}

message ListTemplatesRequest {}
message ListTemplatesResponse {
  // By name, then id.
  repeated Template templates = 1;
}

message CreateTemplateRequest {
  string name = 1;
  string description = 2;
  string body = 3;
  // Absent is 값 없음 — the template has no opinion about that number. Bounds are the post
  // option's own (a positive length, a tag count in 1–10), because a set value only ever
  // lands in a post's option.
  optional int32 target_length = 4;
  optional int32 tag_count = 5;
  string title_area = 6;
}
message CreateTemplateResponse { Template template = 1; }

// Field presence is the edit unit, as it is for UpdateVoiceProfile: only the supplied
// fields change, so two fields edited from two tabs cannot overwrite each other.
message UpdateTemplateRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string body = 4;
  // The two numbers are the exception to the presence rule above: absent means 값 없음 and
  // clears the stored one, because the template screen holds both and sends both on every
  // save (TMPL-8). A second meaning for absence would only give an unset number two
  // ways to be written.
  optional int32 target_length = 5;
  optional int32 tag_count = 6;
  // Follows the presence rule, not the numbers' exception: absent keeps the stored title area
  // and a present '' clears it (TMPL-8).
  optional string title_area = 7;
}
message UpdateTemplateResponse { Template template = 1; }

message DeleteTemplateRequest { string id = 1; }
message DeleteTemplateResponse {
  // Posts whose assignment was cleared by this delete, in the same transaction. No post
  // or content is deleted, and frozen job/experiment payloads keep the template's text.
  int32 detached_posts = 1;
}

message GetFormatGuideRequest {
  // The reader's UI language, never a post's target: the guide frames the task for the person
  // who copies it. UNSPECIFIED is refused.
  ContentLanguage language = 1;
}

message GetFormatGuideResponse {
  // The guide with this server's ceilings stated as numbers, ready to put on the clipboard.
  string text = 1;
}

// A template's four authored texts as the editor holds them. The two generation numbers are not
// part of it: a request never sets them (TMPL-60).
message TemplateDraft {
  string name = 1;
  string description = 2;
  string title_area = 3;
  string body = 4;
}

message StartTemplateRequestRequest {
  // The write model, sent explicitly (MODEL-23); the server infers none.
  ModelRef write_model = 1;
  // The reader's UI language: the 형식 안내 and the request rules are taught in it.
  ContentLanguage language = 2;
  // What the owner typed: a description, a pasted post, both, or what to change.
  string text = 3;
  // The current draft, sent whole so a follow-up request can change only what it asks.
  TemplateDraft draft = 4;
  // Set for a stored template; absent for a new one, which the account cap then bounds.
  optional string template_id = 5;
  // A post attached as the sample (이 글 형식으로 템플릿 만들기, TMPL-64).
  optional string sample_post_slug = 6;
}

message StartTemplateRequestResponse {
  string job_id = 1;
}

message GetTemplateRequestResultRequest {
  string job_id = 1;
}

message GetTemplateRequestResultResponse {
  // The answer, held to the rules a typed draft is (TMPL-60).
  TemplateDraft draft = 1;
  // Wishes about how to write, separated out of the template as material for 지침 (TMPL-61).
  repeated string wishes = 2;
}

message EstimateTemplateRequestRequest {
  ModelRef write_model = 1;
}

// The catalog estimate of one template request, in credits only: never a cost, a price or the
// credit conversion (QUOTA-65). Neither set means no figure can be stated for this model.
message EstimateTemplateRequestResponse {
  // A free-classified write model: the request costs no credits.
  bool free = 1;
  // About this many credits for one request; never a quote.
  optional int32 credits = 2;
}
