syntax = "proto3";

package postpilot.v1;

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";


// provider.proto is the model catalog: what is registered in providers.yaml, what each
// model can do, and the acting user's last choice per stage (PRD §3.3, §6.4, F-4). It also
// carries the recommendation sets: any account lists and applies them, and only the operator
// tier writes them (the three write procedures are in the interceptor's master set, MODEL-69).
//
// Nothing here carries an API key or a provider SDK payload — ids, labels and flags
// only. Keys live in the server's environment and never cross this wire.
service ProviderService {
  // The registry snapshot: every model of every provider, with its flags. A model whose
  // provider has no API key is `disabled` with the reason, so the client can grey it.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {}
  // The acting user's per-stage choices. A saved model that is no longer registered comes
  // back `missing` — and the server has already cleared it, so the user must choose again.
  rpc GetSelections(GetSelectionsRequest) returns (GetSelectionsResponse) {}
  rpc SaveSelection(SaveSelectionRequest) returns (SaveSelectionResponse) {}
  rpc GetComparisonPairs(GetComparisonPairsRequest) returns (GetComparisonPairsResponse) {}
  rpc SaveComparisonPair(SaveComparisonPairRequest) returns (SaveComparisonPairResponse) {}
  // Every set in the operator's order.
  rpc ListRecommendationSets(ListRecommendationSetsRequest) returns (ListRecommendationSetsResponse) {}
  rpc ApplyRecommendationSet(ApplyRecommendationSetRequest) returns (ApplyRecommendationSetResponse) {}
  // Master only. Create (empty id, appended last) or replace one set whole. The draft is
  // validated whole and refused whole, naming every offending field (MODEL_SET_INVALID).
  // Saving never touches anyone's selections: an apply copies the set as it is then (MODEL-71).
  rpc SaveRecommendationSet(SaveRecommendationSetRequest) returns (SaveRecommendationSetResponse) {}
  // Master only.
  rpc DeleteRecommendationSet(DeleteRecommendationSetRequest) returns (DeleteRecommendationSetResponse) {}
  // Master only. Swap a set with its neighbour; at either end of the list it is a no-op.
  rpc MoveRecommendationSet(MoveRecommendationSetRequest) returns (MoveRecommendationSetResponse) {}
}

// The two generation stages and the voice-analysis stage each choose their own model
// ([I3]); the app never fills one in.
enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_OBSERVE = 1;
  STAGE_WRITE = 2;
  STAGE_ANALYZE = 3;
}

enum SelectionSlot {
  SELECTION_SLOT_UNSPECIFIED = 0;
  SELECTION_SLOT_ACTIVE = 1;
  SELECTION_SLOT_CANDIDATE_A = 2;
  SELECTION_SLOT_CANDIDATE_B = 3;
}

// Reused by the Start* RPCs of the generation plans: a job records exactly which model
// it ran on.
message ModelRef {
  string provider_id = 1;
  string model_id = 2;
}

message ModelInfo {
  ModelRef ref = 1;
  string label = 2;
  // Snapshotted from the source catalog — the registry cannot probe them.
  bool vision = 3;
  bool structured_output = 4;
  // The model takes video input. `vision` says it can see a photo; this says it can watch
  // a clip, which is a strictly narrower set of models (VIDEO-11).
  bool video_input = 16;
  // Adapter-derived workflow readiness, independent of catalog video_input.
  // Unknown paths are false; neither field clears the recorded raw capability.
  bool signed_video_url = 17;
  bool inline_static_video = 18;
  bool disabled = 5;
  string disabled_reason = 6;
  int64 context_tokens = 7;
  string input_usd_per_million = 8;
  string output_usd_per_million = 9;
  string pricing_checked_at = 10;
  reserved 11, 12;  // min_plan, locked — model access is decided by the balance now.
  // What one job using this model would hold, for the CALLING account. It is an estimate
  // over a default job shape, so a picker can price a choice before anything is started.
  int32 required_credits = 13;
  // The caller's balance covers required_credits. Display only — the server refuses an
  // unaffordable start whatever the client rendered — and unlike the plan floor it
  // replaces, it is temporary: the same model is affordable again after a renewal.
  bool affordable = 14;
  // The stages this model is registered to serve (MODEL-14): each stage's picker lists
  // exactly its members — the client never re-derives stage fitness from capability flags.
  repeated Stage stages = 15;
  // The operator's grade for this model AT EACH STAGE, for the stages that have one
  // (MODEL-57). A picker shows its own stage's level and orders by it, 가성비 first; a stage
  // absent from this list has no level and sorts last (MODEL-58).
  //
  // Display and ordering only — an unlevelled model is as selectable as a levelled one.
  repeated StageLevel levels = 19;
  bool ai_price_unavailable = 20;
  repeated ModelStageAccess access = 21;
}

message ModelStageAccess {
  Stage stage = 1;
  string grade = 2;
  string required_plan = 3;
  bool entitled = 4;
  bool free_path_available = 5;
  string unavailable_reason = 6;
}

// StageLevel is one stage's level for a model. A repeated message rather than a map
// because a proto map cannot be keyed by an enum, and keying it by the stage's wire string
// would hand the client a name it otherwise never has to know.
message StageLevel {
  Stage stage = 1;
  // "free" | "value" | "balanced" | "premium" | "top".
  string level = 2;
}

message Selection {
  Stage stage = 1;
  ModelRef ref = 2;
  // The saved ref is no longer in the registry. The row is already gone; this tells the
  // client what to grey out and why.
  bool missing = 3;
  SelectionSlot slot = 4;
  string required_plan = 5;
  string unavailable_reason = 6;
}

message ComparisonPair {
  Stage stage = 1;
  Selection candidate_a = 2;
  Selection candidate_b = 3;
}

// Analyze keeps its active selection alone, so its candidates are unset (MODEL-23).
message RecommendationStageSelection {
  Stage stage = 1;
  ModelRef active = 2;
  ModelRef candidate_a = 3;
  ModelRef candidate_b = 4;
}

message RecommendationSet {
  string id = 1;
  string label = 2;
  repeated RecommendationStageSelection selections = 3;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message GetSelectionsRequest {}

message GetSelectionsResponse {
  repeated Selection selections = 1;
  // What one generated post would hold with the CALLER's current observe+write pair. It is
  // the number a "your credits cover about N posts" estimate divides into, computed here
  // because the charge formula — its per-request base especially — is a server-owned rule
  // the client must never re-implement. Zero when no pair is selected yet.
  int32 estimated_post_credits = 2;
  bool ai_price_unavailable = 3;
}

message SaveSelectionRequest {
  Stage stage = 1;
  ModelRef ref = 2;
}

message SaveSelectionResponse {
  Selection selection = 1;
}

message GetComparisonPairsRequest {}
message GetComparisonPairsResponse { repeated ComparisonPair pairs = 1; }

message SaveComparisonPairRequest {
  Stage stage = 1;
  ModelRef candidate_a = 2;
  ModelRef candidate_b = 3;
}
message SaveComparisonPairResponse { ComparisonPair pair = 1; }

message ListRecommendationSetsRequest {}
message ListRecommendationSetsResponse { repeated RecommendationSet sets = 1; }

message ApplyRecommendationSetRequest { string id = 1; }

// One stage entry per stage, observe/analyze/write each at most once. A stage left out leaves
// its slots empty, which the validation reports as required.
message SaveRecommendationSetRequest {
  // Empty creates a new set; otherwise the id of the set to replace.
  string id = 1;
  string label = 2;
  repeated RecommendationStageSelection selections = 3;
}
message SaveRecommendationSetResponse { RecommendationSet set = 1; }

message DeleteRecommendationSetRequest { string id = 1; }
message DeleteRecommendationSetResponse {}

message MoveRecommendationSetRequest {
  string id = 1;
  // true moves the set one place towards the top of the list, false one place down.
  bool earlier = 2;
}
message MoveRecommendationSetResponse {}
message ApplyRecommendationSetResponse {
  RecommendationSet set = 1;
  repeated Selection selections = 2;
  repeated ComparisonPair pairs = 3;
}
