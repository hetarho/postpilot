syntax = "proto3";

package postpilot.v1;

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

import "postpilot/v1/plan.proto";

// BillingService is authenticated but not master-only. Every money figure displayed by
// the client comes from this contract. Subscription and pack KRW prices are fixed offers.
service BillingService {
  rpc GetMyBilling(GetMyBillingRequest) returns (GetMyBillingResponse) {}
  rpc RegisterPaymentMethod(RegisterPaymentMethodRequest) returns (RegisterPaymentMethodResponse) {}
  rpc RemovePaymentMethod(RemovePaymentMethodRequest) returns (RemovePaymentMethodResponse) {}
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse) {}
  rpc ChangeSubscription(ChangeSubscriptionRequest) returns (ChangeSubscriptionResponse) {}
  rpc CancelScheduledChange(CancelScheduledChangeRequest) returns (CancelScheduledChangeResponse) {}
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse) {}
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (ResumeSubscriptionResponse) {}
  rpc QuotePrice(QuotePriceRequest) returns (QuotePriceResponse) {}
  rpc QuoteChange(QuoteChangeRequest) returns (QuoteChangeResponse) {}
  rpc QuotePurchase(QuotePurchaseRequest) returns (QuotePurchaseResponse) {}
  rpc PurchaseCredits(PurchaseCreditsRequest) returns (PurchaseCreditsResponse) {}
  rpc RequestRefund(RequestRefundRequest) returns (RequestRefundResponse) {}
  rpc ListMyRefunds(ListMyRefundsRequest) returns (ListMyRefundsResponse) {}
  // The interceptor and handler both require the master tier.
  rpc ListRefundReviews(ListRefundReviewsRequest) returns (ListRefundReviewsResponse) {}
  rpc ReviewRefund(ReviewRefundRequest) returns (ReviewRefundResponse) {}
  rpc ReconcileRefund(ReconcileRefundRequest) returns (ReconcileRefundResponse) {}
}

enum Term {
  TERM_UNSPECIFIED = 0;
  TERM_MONTHLY = 1;
  TERM_ANNUAL = 2;
}

message BillingSubscription {
  Plan plan = 1;
  Term term = 2;
  string anchor_at = 3;
  string term_start = 4;
  string term_end = 5;
  string next_grant_at = 6;
  bool auto_renew = 7;
  Plan scheduled_plan = 8;
  Term scheduled_term = 9;
  string status = 10;
}

// Only display-safe stored payment-method information crosses the wire. The billing key
// remains server-side; GetMyBilling separately returns the expected opaque customer key
// used by the hosted provider window.
message BillingPaymentMethod {
  string card_label = 1;
  string registered_at = 2;
}

message BillingEvent {
  int64 id = 1;
  string kind = 2;
  Plan plan = 3;
  Term term = 4;
  int32 credits = 5;
  int32 usd_cents = 6;
  int64 krw_per_usd_e4 = 7;
  string rate_date = 8;
  int64 krw = 9;
  string provider_payment_key = 10;
  string order_id = 11;
  string note = 12;
  string created_at = 13;
}

message BillingPurchase {
  string id = 1;
  reserved 2;
  reserved "lot_id";
  int32 credits = 3;
  int32 usd_cents = 4;
  int64 krw = 5;
  reserved 6, 7;
  reserved "provider_payment_key", "order_id";
  string charged_at = 8;
  string refunded_at = 9;
  bool refundable = 10;
  string pack_id = 11;
  string refund_order_id = 12;
}

message GetMyBillingRequest {}

message GetMyBillingResponse {
  // Absent while the account has no paid subscription.
  BillingSubscription subscription = 1;
  // Absent before the account registers a card.
  BillingPaymentMethod payment_method = 2;
  // Newest first and capped at 100 rows by the server.
  repeated BillingEvent history = 3;
  repeated BillingPurchase purchases = 4;
  string customer_key = 5;
}

message RegisterPaymentMethodRequest {
  string auth_key = 1;
  string customer_key = 2;
}

message RegisterPaymentMethodResponse {
  BillingPaymentMethod payment_method = 1;
  bool bonus_granted = 2;
}

message RemovePaymentMethodRequest {}

message RemovePaymentMethodResponse {}

message SubscribeRequest {
  Plan plan = 1;
  Term term = 2;
}

message SubscribeResponse {
  BillingSubscription subscription = 1;
}

message ChangeSubscriptionRequest {
  Plan plan = 1;
  Term term = 2;
  string quote_id = 3;
}

message ChangeSubscriptionResponse {
  BillingSubscription subscription = 1;
  bool applied_now = 2;
}

message CancelScheduledChangeRequest {}

message CancelScheduledChangeResponse {
  BillingSubscription subscription = 1;
}

message CancelSubscriptionRequest {}

message CancelSubscriptionResponse {
  BillingSubscription subscription = 1;
}

message ResumeSubscriptionRequest {}

message ResumeSubscriptionResponse {
  BillingSubscription subscription = 1;
}

message QuotePriceRequest {
  Plan plan = 1;
  Term term = 2;
}

message QuotePriceResponse {
  int32 usd_cents = 1;
  int64 krw = 2;
  int64 krw_per_usd_e4 = 3;
  string rate_date = 4;
  string quote_id = 5;
}

message QuoteChangeRequest {
  Plan plan = 1;
  Term term = 2;
}

message QuoteChangeResponse {
  int32 usd_cents = 1;
  int64 krw = 2;
  int64 krw_per_usd_e4 = 3;
  string rate_date = 4;
  bool applied_now = 5;
  string effective_at = 6;
  string quote_id = 7;
}

message QuotePurchaseRequest {
  int32 usd_cents = 1;
  string pack_id = 2;
}

message QuotePurchaseResponse {
  int32 credits = 1;
  int64 krw = 2;
  int64 krw_per_usd_e4 = 3;
  string rate_date = 4;
  string pack_id = 5;
}

message PurchaseCreditsRequest {
  int32 usd_cents = 1;
  string pack_id = 2;
}

message PurchaseCreditsResponse {
  BillingPurchase purchase = 1;
}

message RefundEvidence {
  int32 paid_model_jobs = 1;
  int32 credits_used = 2;
  int32 credits_reserved = 3;
  int32 server_exports_used = 4;
  int32 server_exports_reserved = 5;
  int32 funded_credits_remaining = 6;
  int32 funded_exports_remaining = 7;
}

message RefundPayment {
  string order_id = 1;
  string kind = 2;
  string provider_payment_key = 3;
  int64 charged_krw = 4;
  string charged_at = 5;
  string coverage_id = 6;
  string pack_lot_id = 7;
}

message BillingRefundRequest {
  string id = 1;
  string user_id = 2;
  string reason = 3;
  string status = 4;
  string requested_at = 5;
  string reviewed_by = 6;
  string reviewed_at = 7;
  int64 reviewed_amount_krw = 8;
  int64 confirmed_amount_krw = 9;
  string confirmed_at = 10;
  string disposition_json = 11;
  RefundPayment payment = 12;
  RefundEvidence evidence = 13;
  int64 prior_refunded_krw = 14;
}

message RequestRefundRequest { string order_id = 1; string reason = 2; }
message RequestRefundResponse { BillingRefundRequest refund = 1; }
message ListMyRefundsRequest {}
message ListMyRefundsResponse { repeated BillingRefundRequest refunds = 1; }
message ListRefundReviewsRequest {}
message ListRefundReviewsResponse { repeated BillingRefundRequest refunds = 1; }
message ReviewRefundRequest {
  string request_id = 1;
  string outcome = 2;
  int64 reviewed_amount_krw = 3;
}
message ReviewRefundResponse { BillingRefundRequest refund = 1; }
message ReconcileRefundRequest { string request_id = 1; }
message ReconcileRefundResponse { BillingRefundRequest refund = 1; }
