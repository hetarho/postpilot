syntax = "proto3";

package postpilot.v1;

import "postpilot/v1/post.proto";

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

// guideline.proto is the 작문 지침 slice: reusable account-owned rules about what a post
// must avoid or watch out for. A guideline is authored text only — nothing here is learned,
// inferred, or written by a model, and no procedure enqueues work or calls a provider.
//
// Nothing else in the contract references a guideline: jobs and experiment snapshots carry
// frozen *texts*, never ids, so deleting a guideline detaches nothing.
//
// Every procedure is scoped to the acting user from the session — no request carries a
// user id, because a user id in a message is a claim by the caller, not a fact.
service GuidelineService {
  rpc ListGuidelines(ListGuidelinesRequest) returns (ListGuidelinesResponse) {}
  rpc CreateGuideline(CreateGuidelineRequest) returns (CreateGuidelineResponse) {}
  rpc UpdateGuideline(UpdateGuidelineRequest) returns (UpdateGuidelineResponse) {}
  rpc DeleteGuideline(DeleteGuidelineRequest) returns (DeleteGuidelineResponse) {}
  // Switches the product-owned 상위 노출 단어 사용 preset and sets its 적용할 분야 (GUIDE-29).
  rpc UpdateGuidelinePreset(UpdateGuidelinePresetRequest) returns (UpdateGuidelinePresetResponse) {}
  // The candidate review surface. A candidate is a completed revision's instruction,
  // recorded verbatim — never learned, never generalized, and never injected into a
  // prompt. Approval is CreateGuideline with from_candidate_id, not a procedure of its
  // own: the create already owns every field rule and every refusal an approval needs.
  rpc ListGuidelineCandidates(ListGuidelineCandidatesRequest) returns (ListGuidelineCandidatesResponse) {}
  rpc DismissGuidelineCandidate(DismissGuidelineCandidateRequest) returns (DismissGuidelineCandidateResponse) {}
}

enum GuidelineScope {
  GUIDELINE_SCOPE_UNSPECIFIED = 0;
  // Applies to every post of the account.
  GUIDELINE_SCOPE_GLOBAL = 1;
  // Applies only to posts whose selected template is in the guideline's template set.
  GUIDELINE_SCOPE_TEMPLATES = 2;
  // Applies only to posts whose 분야 is in the guideline's 분야 set (GUIDE-5).
  GUIDELINE_SCOPE_FIELDS = 3;
}

// A template a guideline is scoped to, projected by name for the management screen. It is a
// read projection through the template directory, never a stored column on the guideline.
message GuidelineTemplateRef {
  string id = 1;
  string name = 2;
}

message Guideline {
  string id = 1;
  // The authored rule, injected verbatim as one line of the 작문 지침 section.
  string text = 2;
  GuidelineScope scope = 3;
  // Empty for GLOBAL. May also be empty for TEMPLATES after every scoped template was
  // deleted — such a guideline applies nowhere until it is rescoped.
  repeated GuidelineTemplateRef templates = 4;
  string created_at = 5;
  string updated_at = 6;
  // The 분야 set of a FIELDS guideline, empty for every other scope.
  repeated BlogField fields = 7;
}

// The one product-owned guideline, 상위 노출 단어 사용 (GUIDE-29). Its multi-select 적용할 분야
// IS its `fields` scope, so there is no second selector meaning the same thing.
message GuidelinePreset {
  string text = 1;
  bool enabled = 2;
  repeated BlogField fields = 3;
}

message ListGuidelinesRequest {}
message ListGuidelinesResponse {
  // In injection order: the global group first, then the scoped group, each by creation
  // time — exactly the order the writer will see them in.
  repeated Guideline guidelines = 1;
  // Shown as a fixed row above the owner's own guidelines.
  GuidelinePreset preset = 2;
}

message CreateGuidelineRequest {
  string text = 1;
  GuidelineScope scope = 2;
  // Required (>= 1 owned template) for TEMPLATES, and must be empty for GLOBAL.
  repeated string template_ids = 3;
  // Set when this create is the approval of a candidate. Needed only because an edited
  // candidate's text no longer matches the row: an unedited approval, and the on-the-spot
  // 지침으로 저장, are matched by text in the same transaction.
  optional string from_candidate_id = 4;
  // Required (>= 1 분야 from the product's list) for FIELDS; an unknown 분야 is NotFound.
  repeated BlogField fields = 5;
}
message CreateGuidelineResponse { Guideline guideline = 1; }

// The whole scope as one value. Its message presence in UpdateGuidelineRequest is what
// distinguishes "leave the scope alone" from "replace it" — a scope is a kind plus a set,
// so the two are only meaningful together and are replaced atomically.
message GuidelineScopePatch {
  GuidelineScope scope = 1;
  repeated string template_ids = 2;
  repeated BlogField fields = 3;
}

message UpdateGuidelineRequest {
  string id = 1;
  optional string text = 2;
  GuidelineScopePatch scope = 3;
}
message UpdateGuidelineResponse { Guideline guideline = 1; }

message DeleteGuidelineRequest { string id = 1; }
// Empty: nothing references a guideline, so a delete detaches nothing and has nothing to
// report back.
message DeleteGuidelineResponse {}

// The preset's 분야 set as one value, whose message presence is what tells "leave the set
// alone" from "replace it", as GuidelineScopePatch does for a scope.
message GuidelinePresetFields {
  repeated BlogField fields = 1;
}

// Presence is the edit unit: an absent `enabled` keeps the switch, and an absent `fields`
// keeps the set.
message UpdateGuidelinePresetRequest {
  optional bool enabled = 1;
  GuidelinePresetFields fields = 2;
}
message UpdateGuidelinePresetResponse { GuidelinePreset preset = 1; }

// A recorded revision instruction awaiting review. It carries NO scope by design: scope is
// a durable decision about every future post, so it is made at approval time and never at
// recording time. That is what lets recording be automatic.
message GuidelineCandidate {
  string id = 1;
  // The instruction exactly as the user typed it, at the REVISION bound (500), which is
  // wider than a guideline's (300). Refusing a long instruction at recording time would
  // lose the most specific corrections; the guideline bound is enforced at approval.
  string text = 2;
  // The post the revision ran on. Empty when that post was deleted — the text survives,
  // the link does not.
  string post_slug = 3;
  // How many completed revisions carried this exact text. The signal that a one-off
  // correction has become a standing rule.
  int32 occurrences = 4;
  string first_seen_at = 5;
  string last_seen_at = 6;
}

message ListGuidelineCandidatesRequest {}
message ListGuidelineCandidatesResponse {
  // The PENDING candidates only, in review order: occurrences descending, then last-seen
  // descending, so the most-repeated correction is first.
  repeated GuidelineCandidate candidates = 1;
  // True when the pending queue is at its server-side bound and further revisions record
  // nothing. The client cannot infer this from an empty list, and it owns no copy of the
  // bound, so the server says it.
  bool queue_full = 2;
}

message DismissGuidelineCandidateRequest { string id = 1; }
// Empty: a dismissal marks the row rather than deleting it — the row is what keeps the
// same instruction from being recorded again — and nothing references a candidate.
message DismissGuidelineCandidateResponse {}
