syntax = "proto3";
package postpilot.v1;
option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";

// Sound identities are separate from the writing-style VoiceService. All IDs are
// resolved within the authenticated owner; requests cannot choose an owner.
service SpokenVoiceService {
 rpc ListSpokenDrafts(ListSpokenDraftsRequest) returns (ListSpokenDraftsResponse) {}
 rpc GetSpokenDraft(SpokenIDRequest) returns (SpokenDraftResponse) {}
 rpc CreateSpokenDraft(CreateSpokenDraftRequest) returns (SpokenDraftResponse) {}
 rpc UpdateSpokenDraft(UpdateSpokenDraftRequest) returns (SpokenDraftResponse) {}
 rpc DeleteSpokenDraft(SpokenMutationRequest) returns (SpokenEmptyResponse) {}
 rpc SelectSpokenCandidate(SpokenCandidateRequest) returns (SpokenDraftResponse) {}
 rpc AcknowledgeSpokenCandidate(SpokenCandidateRequest) returns (SpokenDraftResponse) {}
 rpc ListSpokenVoices(ListSpokenVoicesRequest) returns (ListSpokenVoicesResponse) {}
 rpc GetSpokenVoice(SpokenIDRequest) returns (SpokenVoiceResponse) {}
 rpc RenameSpokenVoice(RenameSpokenVoiceRequest) returns (SpokenVoiceResponse) {}
 rpc RemoveSpokenVoice(SpokenMutationRequest) returns (SpokenVoiceResponse) {}
 rpc GetSpokenSampleAccess(SpokenIDRequest) returns (SpokenSampleAccessResponse) {}
}
message SpokenProfileSnapshot {
 string id = 1;
 int64 revision = 2;
 string provider_id = 3;
 string design_model_id = 4;
 string speech_model_id = 5;
 string design_label = 6;
 string speech_label = 7;
 string grade = 8;
 int32 description_max = 9;
 int32 preview_max = 10;
 int32 speech_max = 11;
 string output_format = 12;
}
message SpokenCandidate {
 string id = 1;
 string asset_id = 2;
 int64 duration_ms = 3;
 string auditioned_at = 4;
}
message SpokenDraft {
 string id = 1;
 int64 revision = 2;
 string name = 3;
 string description = 4;
 string preview_text = 5;
 SpokenProfileSnapshot profile = 6;
 string phase = 7;
 repeated SpokenCandidate candidates = 8;
 string selected_candidate_id = 9;
 string confirmed_voice_id = 10;
 string created_at = 11;
 string updated_at = 12;
 string qualification_session_id = 13;
}
message SpokenVoice {
 string id = 1;
 int64 revision = 2;
 string name = 3;
 string description = 4;
 string preview_text = 5;
 SpokenProfileSnapshot profile = 6;
 string sample_asset_id = 7;
 int64 sample_duration_ms = 8;
 string created_at = 9;
 string removed_at = 10;
}
message SpokenDraftInput {
 string name = 1;
 string description = 2;
 string preview_text = 3;
 string profile_id = 4;
 int64 profile_revision = 5;
 string qualification_session_id = 6;
}
message SpokenIDRequest { string id = 1; }
message ListSpokenDraftsRequest {}
message ListSpokenDraftsResponse { repeated SpokenDraft drafts = 1; }
message CreateSpokenDraftRequest { string idempotency_key = 1; SpokenDraftInput input = 2; }
message UpdateSpokenDraftRequest { string id = 1; int64 expected_revision = 2; string idempotency_key = 3; SpokenDraftInput input = 4; }
message SpokenMutationRequest { string id = 1; int64 expected_revision = 2; string idempotency_key = 3; }
message SpokenCandidateRequest { string draft_id = 1; int64 expected_revision = 2; string idempotency_key = 3; string candidate_id = 4; string playback_id = 5; }
message SpokenDraftResponse { SpokenDraft draft = 1; }
message ListSpokenVoicesRequest { bool include_removed = 1; }
message ListSpokenVoicesResponse { repeated SpokenVoice voices = 1; }
message RenameSpokenVoiceRequest { string id = 1; int64 expected_revision = 2; string idempotency_key = 3; string name = 4; }
message SpokenVoiceResponse { SpokenVoice voice = 1; }
message SpokenEmptyResponse {}
message SpokenSampleAccessResponse { string playback_id = 1; string url = 2; string expires_at = 3; }
