syntax = "proto3";

package postpilot.v1;

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";


// model_catalog.proto is the OPERATOR's half of the model story (plan 18, change 20):
// which of the provider's models this installation offers, and FOR WHICH PURPOSES —
// photo-analysis, style-analysis, writing, image-generation, video-generation.
// ProviderService is the user's half — what each stage may pick, and what they last picked.
//
// Every procedure here is master-only, enforced by the auth interceptor rather than by the
// client. Nothing carries an API key or the provider's base URL: the wire has no field for
// either, the same posture as ProviderService.
service ModelCatalogService {
  // The provider's live catalog merged with what has been curated, plus every curated model
  // the provider has stopped offering. A live read that fails degrades to curated rows and
  // says so in `fetch_error` rather than answering with an empty catalog.
  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse) {}
  // Register or deregister a model for ONE purpose. Registration is what makes a model
  // visible to the matching user-facing stage (the generation purposes feed no stage yet);
  // the server enforces the purpose's capability gate, so an ineligible model is refused
  // whatever the client rendered. Registering never selects anything for anyone.
  rpc SetModelPurpose(SetModelPurposeRequest) returns (SetModelPurposeResponse) {}
  // Change one curated model. Absent fields are not edits, so two operators changing
  // different properties of one model do not overwrite each other.
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse) {}
}

// CatalogEntry is one row of the operator's browse list.
message CatalogEntry {
  string model_id = 1;
  // The vendor segment of the id ("openai" in "openai/gpt-5.6-sol"). It groups and filters
  // the list; the registry's provider id is the same for every entry and is not sent.
  string provider_slug = 2;
  string label = 3;
  string description = 4;
  bool vision = 5;
  bool structured_output = 6;
  int64 context_tokens = 7;
  // Dated display metadata in the same USD-per-million convention ModelInfo uses. Reported
  // provider cost remains authoritative for spending.
  string input_usd_per_million = 8;
  string output_usd_per_million = 9;
  // curated: a catalog row exists, so purposes and reasoning_effort are decisions somebody
  // made rather than the defaults an un-curated candidate is shown with.
  bool curated = 10;
  reserved 11;  // enabled — visibility is per-purpose registration now (change 20).
  reserved 12;  // min_plan — a model is no longer gated by tier.
  // The provider still offered this model at the last successful read. A false value is a
  // flag for the operator, not an action: the model is served disabled-with-reason to users
  // and is never retired automatically.
  bool listed = 13;
  // The reasoning override for the PURPOSE this listing was for, or "" for none. "unset"
  // deliberately omits the wire key and keeps the provider's own behavior.
  //
  // Purpose-scoped since change 24: it used to be one value for the whole model while the
  // code-owned policy it overrides is per stage, so lowering the effort for writing silently
  // changed photo observation.
  string reasoning_effort = 14;
  // Upstream publication time in epoch seconds; orders a vendor's models newest-first.
  int64 source_created_at = 15;
  // The purposes this model is registered to, as their stable slugs
  // ("photo-analysis" | "style-analysis" | "writing" | "image-generation" | "video-generation").
  repeated string purposes = 16;
  // What the model can produce (architecture.output_modalities) — the flags the
  // image/video generation purposes gate on, as `vision` gates photo-analysis.
  bool image_output = 17;
  bool video_output = 18;
  // What this model recently SPENT its completion budget on at the listed purpose's stage.
  // Absent when nothing has been recorded for it, which renders as nothing rather than as a
  // zero that would read as a measurement.
  //
  // It is the only reliable check that a model honors its effort: the provider's
  // `supported_parameters` says a model accepts `reasoning_effort`, never which VALUES it
  // honors, and an unhonored effort behaves like sending none — reasoning runs to the cap.
  optional ReasoningSpend reasoning_spend = 19;
}

// ReasoningSpend is a recent window of one model's completion budget at one stage.
message ReasoningSpend {
  int64 calls = 1;
  int64 reasoning_tokens = 2;
  int64 completion_tokens = 3;
}

message ListCatalogRequest {
  // Bypass the server's catalog cache and read the provider again.
  bool refresh = 1;
  // The purpose tab being listed. It selects which effort each entry reports and which
  // stage's spend signal is attached, so the control and the evidence beside it belong to
  // the tab the operator is looking at. Empty reports neither.
  string purpose = 2;
}

message ListCatalogResponse {
  repeated CatalogEntry entries = 1;
  // RFC 3339 instant of the live read the entries were merged against; empty when the read
  // failed.
  string fetched_at = 2;
  bool from_cache = 3;
  // Set when the live read failed. Entries then carry curated rows only, and no
  // availability bookkeeping was written.
  string fetch_error = 4;
}

message SetModelPurposeRequest {
  string model_id = 1;
  // One of the purpose slugs CatalogEntry.purposes uses.
  string purpose = 2;
  // true registers, false deregisters. Deregistering keeps the curated row (and its
  // reasoning override); it only stops serving the model to that purpose.
  bool registered = 3;
}

message SetModelPurposeResponse {
  CatalogEntry entry = 1;
}

message UpdateModelRequest {
  string model_id = 1;
  reserved 2;  // enabled — visibility is per-purpose registration now (change 20).
  reserved 3;  // min_plan
  // "" clears the override and returns this purpose to the stage reasoning policy.
  optional string reasoning_effort = 4;
  // Which registration the edit applies to. Required: the effort is a property of "this
  // model doing this task", and the server refuses a purpose the model is not registered to
  // — the control only appears once registered, and that is now a server rule rather than a
  // UI convention.
  //
  // Carried here rather than on SetModelPurposeRequest because registering and setting an
  // effort are separate decisions: an operator changes the effort on a model that is already
  // registered, and folding the two would make every effort edit re-assert a registration.
  string purpose = 5;
}

message UpdateModelResponse {
  CatalogEntry entry = 1;
}
