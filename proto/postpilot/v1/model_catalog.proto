syntax = "proto3";

package postpilot.v1;

option go_package = "github.com/postpilot/backend/internal/gen/postpilot/v1;postpilotv1";


// model_catalog.proto is the OPERATOR's half of the model story (plan 18, change 20):
// which of the provider's models this installation offers, and FOR WHICH PURPOSES —
// photo-analysis, style-analysis, writing, image-generation, video-generation.
// ProviderService is the user's half — what each stage may pick, and what they last picked.
//
// Every procedure here is master-only, enforced by the auth interceptor rather than by the
// client. Nothing carries an API key or the provider's base URL: the wire has no field for
// either, the same posture as ProviderService.
service ModelCatalogService {
  // The provider's live catalog merged with what has been curated, plus every curated model
  // the provider has stopped offering. A live read that fails degrades to curated rows and
  // says so in `fetch_error` rather than answering with an empty catalog.
  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse) {}
  // Register or deregister a model for ONE purpose. Registration is what makes a model
  // visible to the matching user-facing stage (the generation purposes feed no stage yet);
  // the server enforces the purpose's capability gate, so an ineligible model is refused
  // whatever the client rendered. Registering never selects anything for anyone.
  rpc SetModelPurpose(SetModelPurposeRequest) returns (SetModelPurposeResponse) {}
  // Change one curated model. Absent fields are not edits, so two operators changing
  // different properties of one model do not overwrite each other.
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse) {}
  // Read a pasted document and report what applying it would do, writing NOTHING — not the
  // registrations, not the availability bookkeeping a ListCatalog would do.
  rpc PreviewCatalogDocument(PreviewCatalogDocumentRequest) returns (PreviewCatalogDocumentResponse) {}
  // Apply a pasted document: every named purpose's registrations are synced whole, in one
  // transaction, or nothing is. The document text is validated again from scratch — this
  // takes no preview token, because the catalog moves between the two calls.
  rpc ApplyCatalogDocument(ApplyCatalogDocumentRequest) returns (ApplyCatalogDocumentResponse) {}
  // Render the current registrations of all five purposes as the same document, so the
  // operator edits what is there rather than writing one from memory.
  rpc ExportCatalogDocument(ExportCatalogDocumentRequest) returns (ExportCatalogDocumentResponse) {}
}

// CatalogDocumentIssue is one refused line. Any issue at all refuses the WHOLE document: a
// half-applied sync would silently deregister what the refused lines were meant to keep.
//
// `cause` is a short slug the operator surface renders with its own copy (bad_version,
// unknown_purpose, duplicate_section, id_before_section, malformed_line, duplicate_id,
// unknown_model, unlisted_model, purpose_ineligible). It is master-only admin detail, not
// one of the normalized user-facing failure reasons.
message CatalogDocumentIssue {
  // 1-based, over the document as pasted — including the lines the parser ignores.
  int32 line = 1;
  string text = 2;
  string cause = 3;
}

// CatalogDocumentPurposePlan is what applying would do to ONE purpose. A purpose the
// document gives no section for is absent from the plan entirely: it is untouched, which is
// not the same as an empty diff.
message CatalogDocumentPurposePlan {
  string purpose = 1;
  repeated string register = 2;
  // The ids that hold this purpose today and the document does not list. A section is the
  // purpose's complete membership, so omission is a deregistration.
  repeated string deregister = 3;
  repeated string unchanged = 4;
  // The registrations the document KEEPS but re-grades (MODEL-59). Its own list rather
  // than part of unchanged: a curator's list pasted without levels clears every one of
  // them, and that has to be visible before the operator confirms.
  repeated CatalogDocumentLevelChange relevel = 5;
}

// CatalogDocumentLevelChange is one registration's grade moving. Either side may be "" —
// that is what setting a first level and clearing one look like.
message CatalogDocumentLevelChange {
  string model_id = 1;
  string from = 2;
  string to = 3;
}

message PreviewCatalogDocumentRequest {
  string document = 1;
}

message PreviewCatalogDocumentResponse {
  repeated CatalogDocumentPurposePlan purposes = 1;
  repeated CatalogDocumentIssue issues = 2;
  // Set when the provider catalog could not be read. This path needs the live snapshot to
  // create a row for an id nobody has curated yet, so an unreadable catalog refuses the
  // paste instead of degrading to stored rows the way ListCatalog does.
  string fetch_error = 3;
}

message ApplyCatalogDocumentRequest {
  // The same text the preview was run on, re-validated here from scratch.
  string document = 1;
}

message ApplyCatalogDocumentResponse {
  repeated CatalogDocumentPurposePlan purposes = 1;
  repeated CatalogDocumentIssue issues = 2;
  string fetch_error = 3;
  // False when anything was refused, and then nothing was written. A rejection discovered
  // here rather than at preview is the catalog having moved, and renders identically.
  bool applied = 4;
}

message ExportCatalogDocumentRequest {}

message ExportCatalogDocumentResponse {
  // Every purpose, including the ones with no registration, so pasting this straight back
  // previews as no change.
  string document = 1;
}

// CatalogEntry is one row of the operator's browse list.
message CatalogEntry {
  string model_id = 1;
  // The vendor segment of the id ("openai" in "openai/gpt-5.6-sol"). It groups and filters
  // the list; the registry's provider id is the same for every entry and is not sent.
  string provider_slug = 2;
  string label = 3;
  string description = 4;
  bool vision = 5;
  bool structured_output = 6;
  int64 context_tokens = 7;
  // Dated display metadata in the same USD-per-million convention ModelInfo uses. Reported
  // provider cost remains authoritative for spending.
  string input_usd_per_million = 8;
  string output_usd_per_million = 9;
  // curated: a catalog row exists, so purposes and reasoning_effort are decisions somebody
  // made rather than the defaults an un-curated candidate is shown with.
  bool curated = 10;
  reserved 11;  // enabled — visibility is per-purpose registration now (change 20).
  reserved 12;  // min_plan — a model is no longer gated by tier.
  // The provider still offered this model at the last successful read. A false value is a
  // flag for the operator, not an action: the model is served disabled-with-reason to users
  // and is never retired automatically.
  bool listed = 13;
  // The reasoning override for the PURPOSE this listing was for, or "" for none. "unset"
  // deliberately omits the wire key and keeps the provider's own behavior.
  //
  // Purpose-scoped since change 24: it used to be one value for the whole model while the
  // code-owned policy it overrides is per stage, so lowering the effort for writing silently
  // changed photo observation.
  string reasoning_effort = 14;
  // Upstream publication time in epoch seconds; orders a vendor's models newest-first.
  int64 source_created_at = 15;
  // The purposes this model is registered to, as their stable slugs
  // ("photo-analysis" | "style-analysis" | "writing" | "image-generation" | "video-generation").
  repeated string purposes = 16;
  // What the model can produce (architecture.output_modalities) — the flags the
  // image/video generation purposes gate on, as `vision` gates photo-analysis.
  bool image_output = 17;
  bool video_output = 18;
  // The model takes VIDEO as input ("video" in architecture.input_modalities). It is a
  // per-run check rather than a sixth purpose: a post with a video requires it of the
  // observe model, and every other run is unaffected (VIDEO-11).
  bool video_input = 28;
  // What this model recently SPENT its completion budget on at the listed purpose's stage.
  // Absent when nothing has been recorded for it, which renders as nothing rather than as a
  // zero that would read as a measurement.
  //
  // It is the measured check that a model honors its effort: an unhonored effort behaves
  // like sending none, and reasoning runs to the cap. The source now also DECLARES the
  // values it accepts (the fields below), so this is corroboration rather than the only
  // signal — a declared list is what the model takes, and this is what it did.
  optional ReasoningSpend reasoning_spend = 19;

  // What the source publishes about this model's reasoning (change 27). EVERY ZERO HERE
  // MEANS "UNKNOWN", NOT "SUPPORTS NOTHING" — the same rule an unpublished price follows.
  //
  // reasons: the source carries a reasoning object for this model at all. False means the
  // model does not reason, and the effort control is absent rather than empty.
  bool reasons = 20;
  // The accepted effort values, verbatim and in the source's DESCENDING order, which is the
  // order a selector should offer them in. Empty means the source does not publish a list
  // for this model (only ~154 of 427 do) — the control then offers all eight values.
  repeated string reasoning_efforts = 21;
  // What the model uses when reasoning is on and no effort is sent. It is what `unset`
  // actually means, so the operator can see that leaving it alone means `high` rather than
  // "off". Empty when the source does not publish one.
  string reasoning_default_effort = 22;
  // Reasoning cannot be turned off: `none` must never be offered or sent.
  bool reasoning_mandatory = 23;
  // The provider receives the effort STRING itself, rather than a token budget OpenRouter
  // derived from it. Nothing consumes it yet; change 29 needs it to size a budget safely.
  bool reasoning_native_effort = 24;
  // The source offers a reasoning token budget for this model. Recorded and displayed only —
  // this change surfaces no input for it.
  bool reasoning_max_tokens = 25;
  // reasoning_effort above is no longer in this model's published list — a revised model, a
  // replaced slug. A WARNING for the row and nothing more: the value is kept and still sent,
  // because the source's list changing is not a mandate to rewrite an operator's decision
  // (the same reasoning `listed = false` carries). Derived at read time from the two fields
  // rather than stored, so it follows the catalog.
  bool reasoning_drifted = 26;
  // The fields above came from a read that actually looked. It is the one thing they cannot
  // say about themselves: `reasons: false` with no list is BOTH "the source publishes no
  // reasoning object" and "nothing has asked yet" — migration 0024 leaves every existing row
  // in exactly that shape. False for an entry served from storage (before the first
  // successful refresh, or while the provider catalog cannot be read), where the screen must
  // keep offering the full effort vocabulary rather than hide a control whose stored value is
  // still being sent.
  bool reasoning_known = 27;

  // The operator's user-facing grade for THIS registration: "value" | "balanced" |
  // "premium" | "top", or "" when they have not set one (MODEL-57). Like reasoning_effort
  // above it belongs to the purpose being listed, not to the model — the same model can be
  // the bargain for one task and the splurge for another.
  //
  // Display and ordering only. It gates nothing, and an unset level leaves the model fully
  // selectable (MODEL-58).
  string level = 29;
}

// ReasoningSpend is a recent window of one model's completion budget at one stage.
message ReasoningSpend {
  int64 calls = 1;
  int64 reasoning_tokens = 2;
  int64 completion_tokens = 3;
  int64 reasoning_truncations = 4;
}

message ListCatalogRequest {
  // Bypass the server's catalog cache and read the provider again.
  bool refresh = 1;
  // The purpose tab being listed. It selects which effort each entry reports and which
  // stage's spend signal is attached, so the control and the evidence beside it belong to
  // the tab the operator is looking at. Empty reports neither.
  string purpose = 2;
}

// One combo's current assignment, for the operator's own screen. Empty ids mean the combo
// has never been assigned, and a comparison screen therefore shows no estimate for it.
message EstimatorComboAssignment {
  string combo = 1;
  string observe_model_id = 2;
  string write_model_id = 3;
}

message ListCatalogResponse {
  repeated CatalogEntry entries = 1;
  // RFC 3339 instant of the live read the entries were merged against; empty when the read
  // failed.
  string fetched_at = 2;
  bool from_cache = 3;
  // Set when the live read failed. Entries then carry curated rows only, and no
  // availability bookkeeping was written.
  string fetch_error = 4;
  // All four estimator combos in ladder order, assigned or not, so the operator sees which
  // price tier is still missing a model. The write is AdminService.SetEstimatorCombo.
  repeated EstimatorComboAssignment estimator_combos = 5;
}

message SetModelPurposeRequest {
  string model_id = 1;
  // One of the purpose slugs CatalogEntry.purposes uses.
  string purpose = 2;
  // true registers, false deregisters. Deregistering keeps the curated row — the operator's
  // curation returns intact on re-registration — but not the effort override, which lives
  // on the registration itself since change 24 and goes with it.
  bool registered = 3;
}

message SetModelPurposeResponse {
  CatalogEntry entry = 1;
}

message UpdateModelRequest {
  string model_id = 1;
  reserved 2;  // enabled — visibility is per-purpose registration now (change 20).
  reserved 3;  // min_plan
  // "" clears the override and returns this purpose to the stage reasoning policy.
  optional string reasoning_effort = 4;
  // Which registration the edit applies to. Required: the effort is a property of "this
  // model doing this task", and the server refuses a purpose the model is not registered to
  // — the control only appears once registered, and that is now a server rule rather than a
  // UI convention.
  //
  // Refused when the model's published `reasoning_efforts` does not contain the value, and
  // `none` is refused when `reasoning_mandatory` (change 27). A model whose list the source
  // does not publish still accepts all eight — absence is unknown, not "supports nothing".
  //
  // Carried here rather than on SetModelPurposeRequest because registering and setting an
  // effort are separate decisions: an operator changes the effort on a model that is already
  // registered, and folding the two would make every effort edit re-assert a registration.
  string purpose = 5;
  // The registration's level (MODEL-57): "value" | "balanced" | "premium" | "top", and ""
  // clears it. Refused when it is none of those, and — like the effort — refused for a
  // purpose the model is not registered to.
  //
  // Optional so the two edits stay independent: a request that sets only the effort leaves
  // the level exactly as it was, and vice versa.
  optional string level = 6;
}

message UpdateModelResponse {
  CatalogEntry entry = 1;
}
