# CI gate: frontend lint + build and backend vet + build must pass. Today it runs on PRs
# into main (merge gate) and on direct pushes to main (solo-dev validation — no PR needed
# to catch a break). A `develop` branch does not exist yet; adding one to `branches:` is a
# one-line change when it does, the same dormancy DEPLOY.md §1 records for the staging
# deploy. No secrets needed, so this is safe to run anytime.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm@10.x) from package.json
      - uses: actions/setup-node@v4
        with:
          # Reads .node-version, so CI and a contributor's fnm/nvm land on one version —
          # the same pattern the Go jobs use with go-version-file.
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dev
      - run: pnpm gen:proto && git diff --exit-code -- backend/internal/gen frontend/src/shared/api/gen
      - run: pnpm gen:sql && git diff --exit-code -- backend
      - run: pnpm --filter ./frontend lint
      - run: pnpm --filter ./frontend format:check
      - run: pnpm --filter ./frontend lint:fsd
      - run: pnpm lint:retirement
      - run: pnpm lint:style:probe
      - run: pnpm lint:style
      - run: pnpm exec haeram-spec-creator check
      - run: pnpm --filter ./frontend test
      - run: pnpm --filter ./frontend build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify deployment recovery and the deploy workflow's shape
        working-directory: .
        run: python3 -m unittest discover -s deploy -p '*_test.py' -v
      - run: go vet ./...
      - run: go build ./...
      # Bounded rather than left on Go's ten-minute per-package default (ARCH-26): cmd/api and
      # internal/clip/store run real SQLite and the whole boot sequence and pass it on their own,
      # so the default made the gate report a clock instead of a result.
      - run: go test -timeout 30m ./...
