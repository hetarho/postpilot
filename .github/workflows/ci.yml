# CI gate: frontend lint + build and backend vet + build must pass. Today it runs on PRs
# into main (merge gate) and on direct pushes to main (solo-dev validation — no PR needed
# to catch a break). A `develop` branch does not exist yet; adding one to `branches:` is a
# one-line change when it does, the same dormancy DEPLOY.md §1 records for the staging
# deploy. No secrets needed, so this is safe to run anytime.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm@10.x) from package.json
      - uses: actions/setup-node@v4
        with:
          # Reads .node-version, so CI and a contributor's fnm/nvm land on one version —
          # the same pattern the Go jobs use with go-version-file.
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:proto && git diff --exit-code -- backend/internal/gen frontend/src/shared/api/gen agent/internal/gen
      - run: pnpm gen:sql && git diff --exit-code -- backend
      - run: pnpm --filter ./frontend lint
      - run: pnpm --filter ./frontend format:check
      - run: pnpm --filter ./frontend lint:fsd
      - run: pnpm lint:style:probe
      - run: pnpm lint:style
      - run: pnpm lint:spec:probe
      - run: pnpm lint:spec
      - run: pnpm --filter ./frontend test
      - run: pnpm --filter ./frontend build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  agent:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: sh -n packaging/install.sh packaging/uninstall.sh
