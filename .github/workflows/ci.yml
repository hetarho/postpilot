# CI gate: frontend lint + build and backend vet + build must pass. Runs on PRs (merge
# gate) AND on direct pushes to develop/main (solo-dev validation — no PR needed to catch
# a break). No secrets needed, so this is safe to run anytime.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm@10.x) from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:proto && git diff --exit-code -- backend/internal/gen frontend/src/shared/api/gen agent/internal/gen
      - run: pnpm gen:sql && git diff --exit-code -- backend
      - run: pnpm --filter ./frontend lint
      - run: pnpm --filter ./frontend lint:fsd
      - run: pnpm lint:style
      - run: pnpm lint:spec
      - run: pnpm --filter ./frontend test
      - run: pnpm --filter ./frontend build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  agent:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: python3 -m unittest hermes/postpilot-publisher/test_plugin.py
