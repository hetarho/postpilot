# ARCH-38: report expensive media checks independently of deployment completion.
name: Verify media

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy backend]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Replacing obsolete test work must never cancel a production rollout.
concurrency:
  group: verify-media-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [image, worker, release]
    name: Media ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run's github.sha points at the default branch, not the build.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3

      - name: Run the image smoke gates
        if: matrix.gate == 'image'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          push: false
          cache-from: |
            type=gha,scope=backend-api
            type=gha,scope=backend-worker
            type=gha

      - name: Build the CPU worker execution smoke
        if: matrix.gate == 'worker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          target: media-worker-smoke
          load: true
          tags: postpilot-worker-smoke:ci
          cache-from: |
            type=gha,scope=backend-worker
            type=gha,scope=backend-api
            type=gha
      - name: Run CPU worker parity, isolation and health
        if: matrix.gate == 'worker'
        run: docker run --rm --cpus=2 --memory=1g postpilot-worker-smoke:ci

      - name: Build disposable storage from pinned upstream source
        if: matrix.gate == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/media/fixture.Dockerfile
          target: media-storage
          load: true
          tags: postpilot:gate-media-storage
          cache-from: type=gha,scope=media-fixture-storage
          cache-to: type=gha,scope=media-fixture-storage,mode=max
      - name: Build the release API using the production build cache
        if: matrix.gate == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          target: media-release-api
          load: true
          tags: postpilot:gate-media-release
          cache-from: |
            type=gha,scope=media-release
            type=gha,scope=backend-api
            type=gha,scope=backend-worker
            type=gha
      - name: Build the release worker in the same builder
        if: matrix.gate == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          target: media-release-worker
          load: true
          tags: postpilot:gate-media-release-worker
          cache-from: |
            type=gha,scope=media-release
            type=gha,scope=backend-worker
            type=gha,scope=backend-api
            type=gha
          cache-to: type=gha,scope=media-release,mode=max
      - name: Run separate-process CPU release in both private layouts
        if: matrix.gate == 'release'
        run: python3 scripts/media-release.py --skip-build --skip-storage-build
