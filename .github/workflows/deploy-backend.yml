# Backend deploy. On push to develop|main (backend paths), the `build` job ALWAYS builds
# the static image (validating the Dockerfile in CI) and PUSHES it to GHCR only when
# deploy is enabled. The `rollout` job (swap the API over SSH) only runs once the VPS is
# ready: set repo variable DEPLOY_ENABLED=true plus the SSH secrets. Until then push +
# rollout are skipped (not failed) — no GHCR/VPS dependency, so this stays green during
# prep. develop→staging, main→production (one VPS, two stacks).
name: Deploy backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  # Manual redeploy from the Actions tab (deploys the selected branch's environment).
  workflow_dispatch:

# Serialize deploys per environment (never roll two images at once).
concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hetarho/postpilot-api
    steps:
      - uses: actions/checkout@v4

      # Login is only needed when we actually push (DEPLOY_ENABLED). GITHUB_TOKEN is automatic.
      - name: Log in to GHCR
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push to GHCR only when deploy is enabled)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      # develop → the staging stack, main → the prod stack. Both live on the one VPS.
      STACK_DIR: /srv/postpilot-${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - name: Swap the API to this commit's image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # IMAGE_TAG is written into the stack .env FIRST so `pull` and `up -d` resolve
          # the SAME image (an inline assignment would only reach the first command).
          script: |
            set -e
            cd ${{ env.STACK_DIR }}
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
