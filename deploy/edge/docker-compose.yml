# The shared edge Caddy for the whole VPS (see Caddyfile for the ownership contract).
# Lives at /srv/edge, copied there once and managed by hand. This file belongs to the BOX,
# not to postpilot: on a VPS that already runs another project's edge, that one stays and
# this copy is only a reference. Nothing here is per-project, which is the point — adding
# the third project touches conf.d/ and .env, never this file.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Every project's domain variables in one shot, so a new project never has to edit
    # this shared file to get its {$..._API_DOMAIN_...} through to Caddy. The whole file
    # lands in the container's environment, so /srv/edge/.env carries DOMAINS ONLY —
    # secrets live in each stack's own .env (chmod 600), never here.
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # One fragment per project. Read-only: Caddy never writes its own config.
      - ./conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true # one-time on the VPS: docker network create edge

volumes:
  caddy_data:
  caddy_config:
