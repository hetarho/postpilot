# API/SQLite stay on the VPS. Host Tailscale Serve terminates private TLS and
# forwards only to this loopback binding. Never expose 9000 through public Caddy.
services:
  api:
    environment:
      MEDIA_INTERNAL_ADDR: ":9000"
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      media: {}

networks:
  media: {}
